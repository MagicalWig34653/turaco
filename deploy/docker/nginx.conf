server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kerberos Negotiate headers with large group memberships exceed the
    # default 8k header buffers.
    large_client_header_buffers 4 64k;

    location /api/ {
        proxy_pass http://turaco-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Attachment uploads (ADR-0037): streamed to the API without buffering; the application enforces the exact cap
    # (ATTACHMENT_MAX_BYTES, at most 100 MiB), this is the outer limit. Downloads are not buffered either.
    location /api/v1/attachments {
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://turaco-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OAuth metadata of the Turaco MCP server (F12 A-D, ADR-0039): RFC 9728 and RFC 8414 documents are served by the
    # API; they answer 404 unless the MCP server is enabled.
    location /.well-known/oauth- {
        proxy_pass http://turaco-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The MCP consent page must never be framed (clickjacking of "Allow access").
    location /oauth/ {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }

    location /health/ {
        proxy_pass http://turaco-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
