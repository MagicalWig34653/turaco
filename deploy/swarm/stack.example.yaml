# Example only. Production secrets, database HA, object storage, TLS, backups,
# placement constraints, update policy, and monitoring are environment-specific.
version: "3.9"
services:
  clamav:
    image: clamav/clamav:1.4.6-debian
    networks: [platform]
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      replicas: 1
      # Pin this service to the node that holds the signature volume, or use shared storage.

  # One-shot job: applies migrations and exits. Redeploy the stack with a new image digest to run it again.
  # turaco-migrate takes a PostgreSQL advisory lock, so a second concurrent run waits instead of racing.
  # API and worker may start before it finishes; /health/ready stays failing until the schema is current.
  turaco-migrate:
    image: ghcr.io/OWNER/REPOSITORY/turaco-worker@sha256:REPLACE_ME
    entrypoint: ["/usr/local/bin/turaco-migrate"]
    networks: [platform]
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
        max_attempts: 5
    secrets:
      - database_url

  turaco-api:
    image: ghcr.io/OWNER/REPOSITORY/turaco-api@sha256:REPLACE_ME
    networks: [platform]
    environment:
      APP_ENV: production
      STORAGE_DRIVER: s3
      STORAGE_MASTER_KEY_FILE: /run/secrets/storage_master_key
      CLAMAV_ADDRESS: clamav:3310
      S3_ENDPOINT: ${TURACO_S3_ENDPOINT:?Set object store endpoint}
      S3_BUCKET: ${TURACO_S3_BUCKET:?Set object store bucket}
      S3_REGION: ${TURACO_S3_REGION:-us-east-1}
      # Network of the reverse proxy in front of the API (turaco-web/ingress);
      # without it login throttling sees only the proxy's address.
      # HTTP_TRUSTED_PROXIES: 10.0.0.0/24
      # AUTH_EMERGENCY_LOGIN_ENABLED: "false"
      # Directory sync: API and worker must use the same LDAP_URL/LDAP_PROVIDER_KEY.
      # The API binds as the user for password login and never receives the
      # sync bind secret; it needs LDAP_URL, TLS settings and LDAP_PROVIDER_KEY.
      # LDAP_URL: ldaps://dc.example.internal:636
      # LDAP_PROVIDER_KEY: ad
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
      restart_policy:
        condition: on-failure
    secrets:
      - database_url
      - source: storage_master_key
        target: storage_master_key
        uid: "10001"
        mode: 0400

  turaco-worker:
    image: ghcr.io/OWNER/REPOSITORY/turaco-worker@sha256:REPLACE_ME
    networks: [platform]
    environment:
      APP_ENV: production
      STORAGE_DRIVER: s3
      STORAGE_MASTER_KEY_FILE: /run/secrets/storage_master_key
      CLAMAV_ADDRESS: clamav:3310
      S3_ENDPOINT: ${TURACO_S3_ENDPOINT:?Set object store endpoint}
      S3_BUCKET: ${TURACO_S3_BUCKET:?Set object store bucket}
      S3_REGION: ${TURACO_S3_REGION:-us-east-1}
      # LDAP_URL: ldaps://dc.example.internal:636
      # LDAP_PROVIDER_KEY: ad
      # LDAP_BIND_DN: CN=svc-turaco,OU=Service Accounts,DC=example,DC=internal
      # LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      # LDAP_USER_BASE_DN: OU=Users,DC=example,DC=internal
      # LDAP_GROUP_BASE_DN: OU=Groups,DC=example,DC=internal
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    secrets:
      - database_url
      - source: storage_master_key
        target: storage_master_key
        uid: "10001"
        mode: 0400
      # - ldap_bind_password

  turaco-web:
    image: ghcr.io/OWNER/REPOSITORY/turaco-web@sha256:REPLACE_ME
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks: [platform]
    deploy:
      replicas: 2
      update_config:
        order: start-first

networks:
  platform:
    driver: overlay

volumes:
  clamav_signatures:

secrets:
  database_url:
    external: true
  storage_master_key:
    external: true
  # ldap_bind_password:
  #   external: true
