services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: turaco
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: turaco
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turaco -d turaco"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  s3mock:
    image: adobe/s3mock:5.1.0
    environment:
      initialBuckets: turaco
    networks: [backend]

  # One-shot migration step. turaco-migrate holds a PostgreSQL advisory lock, so parallel runs are safe.
  turaco-migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/turaco-worker.Dockerfile
    entrypoint: ["/usr/local/bin/turaco-migrate"]
    environment:
      DATABASE_URL: postgres://turaco:change-me@postgres:5432/turaco?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  turaco-api:
    build:
      context: ../..
      dockerfile: deploy/docker/turaco-api.Dockerfile
    environment:
      APP_ENV: local-compose
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://turaco:change-me@postgres:5432/turaco?sslmode=disable
      S3_ENDPOINT: http://s3mock:9090
      S3_BUCKET: turaco
      # Clients reach the API through turaco-web (nginx); trust only nginx's
      # fixed address so login throttling sees real client addresses.
      HTTP_TRUSTED_PROXIES: 172.30.240.10
    depends_on:
      turaco-migrate:
        condition: service_completed_successfully
    networks: [backend]

  turaco-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/turaco-worker.Dockerfile
    environment:
      APP_ENV: local-compose
      DATABASE_URL: postgres://turaco:change-me@postgres:5432/turaco?sslmode=disable
      S3_ENDPOINT: http://s3mock:9090
      S3_BUCKET: turaco
    depends_on:
      turaco-migrate:
        condition: service_completed_successfully
    networks: [backend]

  turaco-web:
    build:
      context: ../..
      dockerfile: deploy/docker/turaco-web.Dockerfile
    ports:
      - "8088:8080"
    depends_on: [turaco-api]
    networks:
      backend:
        ipv4_address: 172.30.240.10

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.240.0/24

volumes:
  postgres:
