<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const read = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const preference = read('turaco.theme');
        const theme = ['turaco', 'dark', 'cyberpunk'].includes(preference)
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'turaco';
        const density = read('turaco.density') === 'compact' ? 'compact' : 'comfortable';
        const motion =
          read('turaco.motion') === 'reduced' ||
          matchMedia('(prefers-reduced-motion: reduce)').matches
            ? 'reduced'
            : 'normal';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.density = density;
        document.documentElement.dataset.motion = motion;
        document.documentElement.style.colorScheme = theme === 'turaco' ? 'light' : 'dark';
      })();
    </script>
    <meta name="theme-color" content="#246747" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#246747" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Turaco</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
