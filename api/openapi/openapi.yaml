  schemas:
    Initiative:
      type: object
      required: [id, reference, title, ownerId, status, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        reference: {type: string}
        title: {type: string}
        goal: {type: string, nullable: true}
        ownerId: {type: string}
        status: {type: string, enum: [idea, planning, proposed, approved, active, on_hold, completed, cancelled]}
        statusReason: {type: string, nullable: true, description: "Reason code. A failed exchange carries the refusal code; `mapping_changed` marks sessions ended by a peer remap or unmap."}
        targetDate: {type: string, format: date, nullable: true}
        approvalId: {type: string, nullable: true}
        proposedBy: {type: string, nullable: true}
        createdBy: {type: string}
        approvedAt: {type: string, format: date-time, nullable: true}
        activatedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
        allowedOperations: {type: array, items: {type: string}, description: Detail only; backend-authorized operations including replan when permitted.}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    InitiativeList:
      type: object
      required: [items, nextCursor, names]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Initiative'}}
        nextCursor: {type: string}
        names: {$ref: '#/components/schemas/InitiativeNames'}
    InitiativeNames:
      type: object
      properties:
        users: {type: object, additionalProperties: {type: string}}
    InitiativeCreate:
      type: object
      required: [title]
      properties:
        title: {type: string}
        goal: {type: string}
        ownerUserId: {type: string}
        targetDate: {type: string, format: date}
    InitiativeUpdate:
      type: object
      required: [expectedVersion]
      properties:
