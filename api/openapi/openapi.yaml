          schema: {type: string, format: uuid}
        - name: kind
          in: query
          schema: {type: string, enum: [application, configuration_profile, compliance_policy, endpoint_security_policy, script, remediation]}
        - name: differences
          in: query
          description: Keep different and uncertain rows only.
          schema: {type: boolean}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One diff page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceManagementDiff'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-groups/{id}/management/diff:
    get:
      operationId: diffDirectoryGroupManagement
      summary: Compare artifacts targeting two Directory Groups.
      description: "Needs management access and `organization.directory.view`. Compares direct and parent-group assignment mode, intent and filter; it does not compare Devices."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: otherGroupId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: kind
          in: query
          schema: {type: string, enum: [application, configuration_profile, compliance_policy, endpoint_security_policy, script, remediation]}
        - name: differences
          in: query
          schema: {type: boolean}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One diff page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupManagementDiff'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /management-filters:
    get:
      operationId: listManagementFilters
      summary: List provider assignment filters.
      description: "Needs `endpoint.management.view` or `endpoints.manage`. Rules are provider data and are not evaluated here."
      security:
