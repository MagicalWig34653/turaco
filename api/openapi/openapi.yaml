              items: {type: string, enum: [unmatched_criteria, criteria_incomplete]}
    SecurityCriterion:
      type: object
      required: [id, position, normalization, matchMethod, rules]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer}
        softwareProductId: {type: string, format: uuid, nullable: true}
        productName: {type: string, nullable: true}
        publisher: {type: string, nullable: true}
        osPlatform: {type: string, nullable: true}
        normalization: {type: string, enum: [matched, unmatched]}
        matchMethod: {type: string, enum: [explicit, product, alias], nullable: true}
        rules:
          type: array
          items: {$ref: '#/components/schemas/SecurityRule'}
    SecurityRule:
      type: object
      required: [kind, version]
      properties:
        kind: {type: string, enum: [introduced, fixed, lt, le, eq]}
        version: {type: string}
    SecurityAdvisoryWithCriteria:
      type: object
      required: [advisory, criteria]
      properties:
        advisory: {$ref: '#/components/schemas/SecurityAdvisory'}
        criteria: {type: array, items: {$ref: '#/components/schemas/SecurityCriterion'}}
    SecurityAdvisoryDetail:
      allOf:
        - {$ref: '#/components/schemas/SecurityAdvisoryWithCriteria'}
        - type: object
          properties:
            productNames: {type: object, additionalProperties: {type: string}}
    SecurityAdvisoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecurityAdvisory'}}
        nextCursor: {type: string, nullable: true}
    SecurityFinding:
      type: object
      description: Device name is redacted unless the caller also has endpoints.view. Confidence is Turaco-derived probable or potential, never automatically confirmed.
      required: [id, reference, advisoryId, advisoryReference, advisoryTitle, deviceId, deviceHidden, softwareProductId, confidence, status, version]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        advisoryId: {type: string, format: uuid}
        advisoryReference: {type: string}
        advisoryTitle: {type: string}
        deviceId: {type: string, format: uuid}
        deviceHidden: {type: boolean}
        deviceName: {type: string, nullable: true}
        softwareProductId: {type: string, format: uuid}
        productName: {type: string, nullable: true}
        installedVersion: {type: string, nullable: true}
        confidence: {type: string, enum: [probable, potential]}
        status: {type: string, enum: [open, investigating, accepted, remediation_planned, remediating, remediated, false_positive, risk_accepted]}
        statusReason: {type: string, nullable: true}
        riskAcceptedBy: {type: string, nullable: true}
        riskAcceptedAt: {type: string, format: date-time, nullable: true}
        riskReviewBy: {type: string, format: date, nullable: true}
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        remediatedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SecurityFindingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecurityFinding'}}
        nextCursor: {type: string, nullable: true}
    SecuritySummary:
      type: object
      required: [byStatus, byConfidence, affectedDevices, oldestOpenSince, unmatchedCriteria]
      properties:
        byStatus: {type: object, additionalProperties: {type: integer}}
        byConfidence: {type: object, additionalProperties: {type: integer}}
        affectedDevices: {type: integer}
        unmatchedCriteria: {type: integer, minimum: 0, description: Criteria that could not be matched to a Software Product and therefore were not evaluated.}
        oldestOpenSince: {type: string, format: date-time, nullable: true}
    SecurityTransition:
      type: object
      required: [id, toStatus, operation, correlationId, createdAt]
      properties:
        id: {type: string, format: uuid}
        fromStatus: {type: string, nullable: true}
        toStatus: {type: string}
        operation: {type: string}
        reason: {type: string, nullable: true}
        actorUserId: {type: string, nullable: true}
        actorSystem: {type: string, nullable: true}
        correlationId: {type: string}
        createdAt: {type: string, format: date-time}
    SecurityTransitionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecurityTransition'}}
        nextCursor: {type: string, nullable: true}
    SecurityImportResult:
      type: object
      required: [Created, Updated, Unchanged, Rejected, Reanalyze, Errors]
      properties:
        Created: {type: integer}
        Updated: {type: integer}
        Unchanged: {type: integer}
        Rejected: {type: integer}
        Reanalyze: {type: integer}
        Errors:
          type: array
          items:
            type: object
            properties:
              Index: {type: integer}
              Message: {type: string}
    SecurityAdvisoryInput:
      type: object
      additionalProperties: false
      required: [title, severity]
      properties:
        source: {type: string, description: Manual creation always uses source manual.}
        externalId: {type: string, maxLength: 200}
        title: {type: string, minLength: 1, maxLength: 300}
        summary: {type: string, maxLength: 4000}
        severity: {type: string, enum: [none, low, medium, high, critical]}
        sourceUrl: {type: string, format: uri, pattern: '^https://'}
        publishedAt: {type: string, format: date-time}
        modifiedAt: {type: string, format: date-time}
        criteria:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/SecurityCriterionInput'}
    SecurityCriterionInput:
      type: object
      additionalProperties: false
      properties:
        softwareProductId: {type: string, format: uuid}
        productName: {type: string, maxLength: 200}
        publisher: {type: string, maxLength: 200}
        osPlatform: {type: string, enum: [windows, macos, ios, android, linux, other]}
        rules:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [kind, version]
            properties:
              kind: {type: string, enum: [introduced, fixed, lt, le, eq]}
              version: {type: string, maxLength: 100}
    SecurityAdvisoryImport:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/SecurityAdvisoryInput'}
    SecurityAdvisoryPatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        title: {type: string, maxLength: 300}
        summary: {type: string, maxLength: 4000}
        severity: {type: string, enum: [none, low, medium, high, critical]}
        sourceUrl: {type: string, format: uri, pattern: '^https://'}
    SecurityCriteriaEdit:
      type: object
      additionalProperties: false
      required: [expectedVersion, criteria]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        criteria:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/SecurityCriterionInput'}
    SecurityNotApplicableRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, enum: [product_not_used, version_not_used, configuration_not_affected, duplicate, other], description: Other also requires security.accept_risk (403 otherwise).}
    SecurityFalsePositiveRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, enum: [version_misreported, product_mismatch, not_installed, configuration_not_affected, other], description: Configuration_not_affected and other also require security.accept_risk (403 otherwise).}
    SecurityReopenRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, enum: [review_due, new_information, error_correction, other]}
    SecurityRiskAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, reviewBy]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, enum: [compensating_control, low_exposure, no_fix_available, business_need, other]}
        reviewBy: {type: string, format: date, description: After today and no more than twelve months ahead.}
    SecurityVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, description: Required for not-applicable, false-positive, accept-risk and reopen.}
        reviewBy: {type: string, format: date, description: Required for accept-risk and at most twelve months ahead.}
    RemoteAccessRefusalCode:
      type: string
      description: Policy refusal; the HTTP code is `remoteaccess.<value>` (409). In capabilities the same values explain why no session can start.
      enum: [provider_disabled, device_unknown, device_retired, stale_device, no_peer_mapping, ticket_unavailable, mapping_changed, no_recipient, approval_required, holder_mismatch, session_open, approver_required]
    RemoteAccessSessionStatus:
      type: string
      enum: [requested, pending_approval, authorized, launched, closed, rejected, cancelled, expired, failed]
    RemoteAccessCapabilities:
      type: object
      required: [deviceId, enabled, deviceKnown, observedAt, stale, providers]
      properties:
        deviceId: {type: string, format: uuid}
        enabled: {type: boolean, description: At least one provider is enabled in this deployment.}
        deviceKnown: {type: boolean}
        observedAt: {type: string, format: date-time, nullable: true, description: Last observation of the Device (source of freshness).}
        lastCheckinAt: {type: string, format: date-time, nullable: true, description: Last check-in reported by the provider; `stale` derives from it.}
        stale: {type: boolean, description: No observation for 7 days.}
        providers:
          type: array
          items:
            type: object
            required: [provider, capabilities, mapped, available, reasons]
            properties:
              provider: {type: string}
              capabilities:
                type: object
                properties:
                  attended: {type: boolean}
                  observeSessions: {type: boolean}
                  closeSessions: {type: boolean}
              mapped: {type: boolean}
              peerId: {type: string, description: Masked unless the caller holds remote_access.admin. Omitted when not mapped.}
              available: {type: boolean}
              reasons:
                type: array
                items: {$ref: '#/components/schemas/RemoteAccessRefusalCode'}
    RemoteAccessSession:
      type: object
      required: [id, reference, deviceId, ticketId, provider, mode, status, initiatedBy, consent, expiresAt, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        deviceId: {type: string, format: uuid}
        ticketId: {type: string, format: uuid}
        provider: {type: string}
        mode: {type: string, enum: [attended]}
        status: {$ref: '#/components/schemas/RemoteAccessSessionStatus'}
        statusReason: {type: string, nullable: true}
        initiatedBy: {type: string, format: uuid}
        approvalId: {type: string, format: uuid, nullable: true}
        consent: {type: string, enum: [unknown, granted, declined, not_required], description: Turaco-recorded consent; separate from authorization and from provider records.}
        consentRecordedBy: {type: string, format: uuid, nullable: true}
        consentRecordedAt: {type: string, format: date-time, nullable: true}
        mismatchReason: {type: string, enum: [holder_changed, shared_device, on_behalf], nullable: true}
        launchedAt: {type: string, format: date-time, nullable: true}
        closedAt: {type: string, format: date-time, nullable: true}
        expiresAt: {type: string, format: date-time}
        note: {type: string, nullable: true}
        observedConnectedAt: {type: string, format: date-time, nullable: true, description: Reported by the provider; null is unknown.}
        observedEndedAt: {type: string, format: date-time, nullable: true, description: Reported by the provider; null is unknown.}
        observedSource: {type: string, nullable: true}
        observedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RemoteAccessSessionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RemoteAccessSession'}
        nextCursor: {type: string, nullable: true}
    RemoteAccessTransition:
      type: object
      properties:
        id: {type: string, format: uuid}
        fromStatus: {type: string, nullable: true}
        toStatus: {type: string}
        operation: {type: string}
        reason: {type: string, nullable: true}
        actorUserId: {type: string, format: uuid, nullable: true}
        actorSystem: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    RemoteAccessSessionDetail:
      type: object
      required: [session, transitions]
      properties:
        session: {$ref: '#/components/schemas/RemoteAccessSession'}
        transitions:
          type: array
          items: {$ref: '#/components/schemas/RemoteAccessTransition'}
    RemoteAccessSessionRequest:
      type: object
      additionalProperties: false
      required: [deviceId, ticketId, provider]
      properties:
        deviceId: {type: string, format: uuid}
        ticketId: {type: string, format: uuid}
        provider: {type: string}
        reason: {type: string, enum: [holder_changed, shared_device, on_behalf], description: Required when the Ticket's affected User is not the Device's holder.}
        note: {type: string, maxLength: 500, description: Plain text, never audited.}
        approverUserId: {type: string, format: uuid}
        approverTeamId: {type: string, format: uuid}
    RemoteAccessVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
    RemoteAccessConsentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, decision]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        decision: {type: string, enum: [granted, declined]}
    RemoteAccessReasonRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, description: "Close: completed, technician_aborted, connection_failed, other. Cancel: no_longer_needed, wrong_device, ticket_resolved, other."}
    RemoteAccessLaunchHandle:
      type: object
      required: [token, expiresAt]
      properties:
        token: {type: string, description: One-time handle, returned exactly once and never stored in clear text. Not a provider credential.}
        expiresAt: {type: string, format: date-time, description: 60 seconds after issue.}
    RemoteAccessExchangeRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string}
    RemoteAccessExchange:
      type: object
      required: [sessionId, reference, provider, launchUri, session]
      properties:
        sessionId: {type: string, format: uuid}
        reference: {type: string}
        provider: {type: string}
        launchUri: {type: string, description: Provider launch link (custom scheme). Present only in this response; never log, store or place it in a URL.}
        session: {$ref: '#/components/schemas/RemoteAccessSession'}
    RemoteAccessPeerMapping:
      type: object
      properties:
        id: {type: string, format: uuid}
        deviceId: {type: string, format: uuid}
        provider: {type: string}
        peerId: {type: string, description: Masked unless the caller holds remote_access.admin.}
        source: {type: string}
        reason: {type: string, nullable: true}
        mappedBy: {type: string, format: uuid, nullable: true}
        mappedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time, nullable: true}
        closeReason: {type: string, nullable: true}
    RemoteAccessPeerMappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RemoteAccessPeerMapping'}
    RemoteAccessPeerMappingRequest:
      type: object
      additionalProperties: false
      required: [deviceId, provider, peerId, reason]
      properties:
        deviceId: {type: string, format: uuid}
        provider: {type: string}
        peerId: {type: string}
        reason: {type: string, enum: [initial_mapping, correction, provider_change, other]}
    RemoteAccessObservationsSummary:
      type: object
      required: [unattributedRecords, byReason, since]
      properties:
        unattributedRecords: {type: integer}
        byReason:
          type: object
          properties:
            unattributed: {type: integer}
            duplicate: {type: integer}
            after_close: {type: integer}
        since: {type: string, format: date-time}
    PresenceStatus:
      type: object
      properties:
        enabled: {type: boolean}
        permissions:
          type: object
          properties:
            manageOwn: {type: boolean}
            viewAvailability: {type: boolean}
            viewEntries: {type: boolean}
            manageEntries: {type: boolean}
            manageTeams: {type: boolean}
            admin: {type: boolean}
    PresenceSettings:
      type: object
      properties:
        enabled: {type: boolean}
        dpiaRecordedOn: {type: [string, 'null'], format: date}
        councilConfirmedOn: {type: [string, 'null'], format: date}
        retentionDays: {type: integer, minimum: 1, maximum: 30}
        maxRetentionDays: {type: integer, description: PRESENCE_RETENTION_DAYS.}
        externalSourcesEnabled: {type: boolean}
        disabledAt: {type: [string, 'null'], format: date-time}
        version: {type: integer}
        updatedAt: {type: string, format: date-time}
    PresenceSettingsRequest:
      type: object
      additionalProperties: false
      required: [enabled, retentionDays, expectedVersion]
      properties:
        enabled: {type: boolean}
        dpiaRecordedOn: {type: string, format: date}
        councilConfirmedOn: {type: string, format: date}
        retentionDays: {type: integer, minimum: 1, maximum: 30}
        externalSourcesEnabled: {type: boolean}
        expectedVersion: {type: integer, minimum: 1}
    PresenceRecurrence:
      type: object
      additionalProperties: false
      required: [frequency, endsOn]
      properties:
        frequency: {type: string, enum: [daily, weekly, monthly]}
        interval: {type: integer, minimum: 1, maximum: 365, default: 1}
        weekday: {type: integer, minimum: 1, maximum: 7, description: Weekly; defaults to the weekday of the first occurrence.}
        dayOfMonth: {type: integer, minimum: 1, maximum: 31, description: Monthly; defaults to the day of the first occurrence.}
        endsOn: {type: string, format: date, description: Last local date; at most 366 days after the first occurrence.}
    PresenceTimeFields:
      type: object
      properties:
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        startDate: {type: string, format: date, description: All-day entries (with endDate and timezone), inclusive local dates.}
        endDate: {type: string, format: date}
        timezone: {type: string, description: "IANA zone; required for all-day entries and recurrences."}
    PresenceEntryRequest:
      allOf:
        - $ref: '#/components/schemas/PresenceTimeFields'
        - type: object
          required: [kind]
          properties:
            userId: {type: string, format: uuid, description: Defaults to the caller.}
            kind: {type: string, enum: [work_location, unavailable]}
            locationType: {type: string, enum: [location, remote, travelling]}
            locationId: {type: string, format: uuid, description: Only with locationType location.}
            visibility: {type: string, enum: [availability, detail], default: availability, description: "`detail` lets presence.view_entries holders see the entry."}
            recurrence: {$ref: '#/components/schemas/PresenceRecurrence'}
    PresenceRescheduleRequest:
      allOf:
        - $ref: '#/components/schemas/PresenceTimeFields'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: {type: integer, minimum: 1}
    PresenceChangeLocationRequest:
      type: object
      additionalProperties: false
      required: [locationType, expectedVersion]
      properties:
        locationType: {type: string, enum: [location, remote, travelling]}
        locationId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 1}
    PresenceChangeRecurrenceRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        timezone: {type: string}
        recurrence:
          description: Null removes the recurrence.
          oneOf: [{$ref: '#/components/schemas/PresenceRecurrence'}, {type: 'null'}]
        expectedVersion: {type: integer, minimum: 1}
    PresenceVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
    PresenceEntry:
      type: object
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        kind: {type: string, enum: [work_location, unavailable]}
        locationType: {type: [string, 'null'], enum: [location, remote, travelling, null]}
        locationId: {type: [string, 'null'], format: uuid}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        allDay: {type: boolean}
        timezone: {type: [string, 'null']}
        recurrence: {oneOf: [{$ref: '#/components/schemas/PresenceRecurrence'}, {type: 'null'}]}
        source: {type: string, description: "`manual` or an external source key (read-only)."}
        status: {type: string, enum: [active, cancelled]}
        visibility: {type: string, enum: [availability, detail]}
        occurrences:
          type: array
          description: Occurrences inside the requested window.
          items: {type: object, properties: {from: {type: string, format: date-time}, to: {type: string, format: date-time}}}
        createdBy: {type: [string, 'null'], format: uuid}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PresenceEntryList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PresenceEntry'}
    PresenceSource:
      type: object
      properties:
        source: {type: string}
        freshness: {type: string, enum: [manual, fresh, stale]}
        observedAt: {type: [string, 'null'], format: date-time}
    PresenceAvailability:
      type: object
      properties:
        userId: {type: string, format: uuid}
        value: {type: string, enum: [available, limited, unavailable, unknown]}
        explanation: {type: string, description: "unavailable_entry, work_location, remote_when_onsite_needed, travelling, other_location, no_entry, source_stale, out_of_scope."}
        limitedBy: {type: [string, 'null'], description: "remote, travelling or other_location when limited."}
        until: {type: [string, 'null'], format: date-time}
        sources:
          type: array
          items: {$ref: '#/components/schemas/PresenceSource'}
    PresenceAvailabilityList:
      type: object
      properties:
        at: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/PresenceAvailability'}
    PresenceAvailabilityWindow:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              from: {type: string, format: date-time}
              to: {type: string, format: date-time}
              value: {type: string, enum: [available, limited, unavailable, unknown]}
              explanation: {type: string}
              limitedBy: {type: [string, 'null']}
              sources:
                type: array
                items: {$ref: '#/components/schemas/PresenceSource'}
    PresenceTeamMinimum:
      type: object
      properties:
        teamId: {type: string, format: uuid}
        minimum: {type: integer}
        onsiteMinimum: {type: [integer, 'null']}
        locationId: {type: [string, 'null'], format: uuid}
        version: {type: integer}
    PresenceTeamMinimumRequest:
      type: object
      additionalProperties: false
      required: [minimum]
      properties:
        minimum: {type: integer, minimum: 0, maximum: 1000}
        onsiteMinimum: {type: integer, minimum: 0, maximum: 1000}
        locationId: {type: string, format: uuid, description: Coverage Location of the on-site minimum.}
        expectedVersion: {type: integer, minimum: 1}
    PresenceTeamCoverage:
      type: object
      properties:
        teamId: {type: string, format: uuid}
        members: {type: [integer, 'null'], description: Null for a Team below two members.}
        state: {type: string, enum: [ok, below, unknown]}
        minimum: {oneOf: [{$ref: '#/components/schemas/PresenceTeamMinimum'}, {type: 'null'}]}
        days:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              available: {type: integer}
              limited: {type: integer}
              unavailable: {type: integer}
              unknown: {type: integer}
              onsiteAvailable: {type: [integer, 'null']}
              state: {type: string, enum: [ok, below, unknown]}
              unavailableUserIds: {type: array, items: {type: string, format: uuid}, description: Only for presence.view_entries holders.}
    AiUsageCounters:
      type: object
      properties:
        day: {type: string, format: date}
        requestsToday: {type: integer}
        requestsThisHour: {type: integer}
        requestsTodayRemaining: {type: integer}
        requestsHourRemaining: {type: integer}
        tokensTodayRemaining: {type: integer, format: int64}
        installationTokensRemaining: {type: integer, format: int64}
    ModulesStatus:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, enabled]
            properties:
              key: {type: string}
              enabled: {type: boolean}
    ModuleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Module'}
    Module:
      type: object
      additionalProperties: false
      required: [key, nameKey, descriptionKey, category, core, enabled, switchOn, state, blockedReason, requires, requiredBy, startupGates, version, changedAt, changedByUserId, reasonCode]
      properties:
        key: {type: string}
        nameKey: {type: string, description: "i18n key, modules.<key>.name."}
        descriptionKey: {type: string, description: "i18n key, modules.<key>.description."}
        category: {type: string, enum: [core, service_management, assets_inventory, endpoints_security, infrastructure_operations, workforce, insight]}
        core: {type: boolean, description: "Core modules are always on and cannot be switched."}
        enabled: {type: boolean, description: "Effective: state is enabled."}
        switchOn: {type: boolean, description: "Position of the switch itself."}
        state: {type: string, enum: [enabled, disabled, blocked]}
        blockedReason: {type: string, nullable: true, enum: [startup_gate_off, dpia_not_recorded, no_enabled_provider, no_providers_configured, runtime_setting_off, dependency_disabled, null]}
        requires: {type: array, items: {type: string}}
        requiredBy: {type: array, items: {type: string}}
        startupGates: {type: array, items: {type: string}, description: "Read-only environment variables that gate the module at startup."}
        version: {type: integer, description: "0 until the switch was first changed; send as expectedVersion."}
        changedAt: {type: string, format: date-time, nullable: true}
        changedByUserId: {type: string, format: uuid, nullable: true}
        reasonCode: {type: string, nullable: true, enum: [upgrade_default, initial_setup, business_need, not_needed, maintenance, compliance_review, evaluation, null]}
    ModuleSwitchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reasonCode]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        reasonCode: {type: string, enum: [initial_setup, business_need, not_needed, maintenance, compliance_review, evaluation]}
    ModuleError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
            blockers: {type: array, items: {type: string}, description: "Module keys that must be enabled (enable) or disabled (disable) first."}
    AiStatus:
      type: object
      properties:
        enabled: {type: boolean}
        permissions:
          type: object
          properties:
            use: {type: boolean}
            settingsView: {type: boolean}
            settingsManage: {type: boolean}
            usageView: {type: boolean}
        provider:
          type: [object, 'null']
          properties:
            displayName: {type: string}
            local: {type: boolean, description: "True when the model runtime is inside the installation's network."}
            model: {type: string}
            allowedDataClasses: {type: array, items: {$ref: '#/components/schemas/AiDataClass'}}
        tools: {type: array, items: {type: string}, description: "Tool names usable by the caller with this provider."}
        conversationTtlMinutes: {type: integer}
        usage: {oneOf: [{$ref: '#/components/schemas/AiUsageCounters'}, {type: 'null'}]}
    AiDataClass:
      type: string
      enum: [public_reference, business_record, personal_contact, device_context]
    AiResourceRef:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [ticket, device]}
        id: {type: string, format: uuid}
    AiMessageRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        conversationId: {type: string, description: "Omit to start a conversation."}
        text: {type: string, minLength: 1, maxLength: 4000}
        context: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/AiResourceRef'}, description: "Records the UI context names (for example the open Ticket); they are the only records, besides ids the User types, the assistant may read without consent."}
    AiConversationRef:
      type: object
      required: [conversationId]
      additionalProperties: false
      properties:
        conversationId: {type: string}
    AiConsentRequest:
      type: object
      required: [conversationId, resourceType, resourceId]
      additionalProperties: false
      properties:
        conversationId: {type: string}
        resourceType: {type: string, enum: [ticket, device]}
        resourceId: {type: string, format: uuid}
    AiTurn:
      type: object
      properties:
        conversationId: {type: string}
        answer: {type: string, description: "Untrusted model output: render as inert text/Markdown, never auto-load images or follow links."}
        stopReason: {type: string, enum: [answer, empty, iteration_limit, malformed_tool_calls]}
        toolsUsed:
          type: array
          items:
            type: object
            properties:
              tool: {type: string}
              target: {oneOf: [{$ref: '#/components/schemas/AiResourceRef'}, {type: 'null'}]}
              itemCount: {type: integer}
              outcome: {type: string, enum: [ok, not_found, forbidden, invalid_arguments, unknown_tool, permission_denied, scope_expansion, too_many_calls, tool_error, egress_violation, result_too_large]}
        scopeRequests:
          type: array
          items:
            type: object
            properties:
              resourceType: {type: string}
              resourceId: {type: string, format: uuid}
              tool: {type: string}
        tokens:
          type: object
          properties:
            in: {type: integer}
            out: {type: integer}
        usage: {$ref: '#/components/schemas/AiUsageCounters'}
    AiTranscript:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              role: {type: string, enum: [user, assistant]}
              content: {type: string}
    AiSettingsFields:
      type: object
      properties:
        enabled: {type: boolean}
        retainConversations: {type: boolean}
        retentionDays: {type: integer, minimum: 1, maximum: 30}
        userRequestsPerHour: {type: integer, minimum: 1, maximum: 10000}
        userRequestsPerDay: {type: integer, minimum: 1, maximum: 100000}
        userTokensPerDay: {type: integer, minimum: 1000}
        installationTokensPerDay: {type: integer, minimum: 1000}
        maxOutputTokens: {type: integer, minimum: 64, maximum: 8192}
        maxToolIterations: {type: integer, minimum: 1, maximum: 10}
    AiSettings:
      allOf:
        - $ref: '#/components/schemas/AiSettingsFields'
        - type: object
          properties:
            updatedBy: {type: [string, 'null'], format: uuid}
            updatedAt: {type: string, format: date-time}
            version: {type: integer}
    AiSettingsRequest:
      allOf:
        - $ref: '#/components/schemas/AiSettingsFields'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: {type: integer}
    AiProviderFields:
      type: object
      properties:
        displayName: {type: string, maxLength: 100}
        endpointUrl: {type: string, description: "https, or http for a local provider; no userinfo or query. Empty for kind fake."}
        model: {type: string}
        local: {type: boolean}
        allowedDataClasses: {type: array, items: {$ref: '#/components/schemas/AiDataClass'}}
        dpaRecordedOn: {type: [string, 'null'], format: date}
        noTrainingConfirmed: {type: boolean}
        region: {type: string}
        secretRef: {type: [string, 'null'], description: "Name of a deployment secret file; never the secret."}
        enabled: {type: boolean}
        priceInPerMTok: {type: number}
        priceOutPerMTok: {type: number}
    AiProvider:
      allOf:
        - $ref: '#/components/schemas/AiProviderFields'
        - type: object
          properties:
            id: {type: string, format: uuid}
            kind: {type: string, enum: [fake, openai_compatible]}
            version: {type: integer}
            createdAt: {type: string}
            updatedAt: {type: string}
    AiProviderRequest:
      allOf:
        - $ref: '#/components/schemas/AiProviderFields'
        - type: object
          required: [kind, displayName]
          additionalProperties: false
          properties:
            kind: {type: string, enum: [fake, openai_compatible]}
            expectedVersion: {type: integer, description: "Required on PUT."}
    AiProviderList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AiProvider'}}
    AiProviderTest:
      type: object
      properties:
        ok: {type: boolean}
        code: {type: string, enum: [ok, provider_unavailable]}
        durationMs: {type: integer}
    AiUsage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              day: {type: string, format: date}
              users: {type: integer}
              requests: {type: integer}
              tokensIn: {type: integer}
              tokensOut: {type: integer}
              estimatedCostMicro: {type: integer}
