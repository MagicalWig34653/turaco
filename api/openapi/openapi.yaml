        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '409': {$ref: '#/components/responses/RequestsConflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /assets:
    get:
      operationId: listAssets
      summary: List assets.
      description: "Needs `assets.view` or `assets.manage`. Filters combine; `q` matches the reference, serial number or asset tag by prefix. Keyset paginated."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: {type: string, enum: [received, available, reserved, assigned, returned, in_repair, retired, disposed, lost]}
        - name: productId
          in: query
          schema: {type: string, format: uuid}
        - name: assigneeId
          in: query
          description: Active assignment to this User, Team or Location
          schema: {type: string, format: uuid}
        - name: locationId
          in: query
          schema: {type: string, format: uuid}
        - name: q
          in: query
