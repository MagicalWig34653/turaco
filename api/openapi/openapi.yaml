      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Role'}
    RoleCreate:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        permissions:
          type: array
          items: {type: string}
    RoleUpdate:
      type: object
      additionalProperties: false
