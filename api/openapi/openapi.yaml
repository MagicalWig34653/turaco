        roleKey: {type: string}
        subjectType: {type: string, enum: [user, directory_group]}
        subjectId: {type: string}
        subjectDisplayName: {type: string, description: Current display name of the User or Directory Group; empty if unknown.}
        scope: {type: string, enum: [global]}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string, description: User id of the creator; omitted for CLI-created assignments.}
        revokedAt: {type: string, format: date-time}
        revokedBy: {type: string}
    RoleAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
