        - {name: ringId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {$ref: '#/components/schemas/DeploymentTargetState'}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentTargetPage'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/attempts:
    get:
      operationId: listDeploymentAttempts
      summary: List the assignment attempts of a Deployment (keyset).
      description: "Writer attempts (set or clear assignment) with their outcome code."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentAttemptPage'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/report:
    get:
      operationId: getDeploymentReport
      summary: Rollout report of a Deployment (F9 G4).
      description: "Needs `deployments.view`, `deployments.manage` or `deployments.execute` (404 otherwise, also for a Deployment that is not visible). Totals by target state, success rate and median time to success (on decided targets), per ring the counts and the gate outcomes (passed, or failed with a reason), top failure reasons (the provider's raw status or Turaco's reason code), open failure clusters, the people involved, the transition history and the follow-up Tasks. Clusters are derived by Turaco (error code, model, manufacturer, OS version, ring) and distinct from provider-reported errors. Contains no device names."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentReport'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/report.csv:
    get:
      operationId: getDeploymentReportCsv
      summary: Download the per-target report as CSV (F9 G4).
      description: "Same read rule as the report. One row per target with ring, device id, device name, state, reason, error code and timestamps. `device_name` is empty without `endpoints.view`. Cells that a spreadsheet would read as a formula are neutralized. At most 50 000 rows; a final `truncated` row marks a cut export. Served as an attachment with `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: CSV file.
          content:
            text/csv:
              schema: {type: string}
        '429':
          description: At most two exports run at the same time (endpoints.export_busy). Every export is audited; a late store error aborts the connection instead of returning a complete-looking file.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/security-context:
    get:
      operationId: getDeploymentSecurityContext
      summary: Security advisories on the deployed product and target devices (F9 G4).
      description: "Same read rule as the report. Asks Security for the advisories (applicable, remediation planned, remediating) of the Deployment's product with open findings on the Deployment's target Devices (at most 20 000 are considered; `truncated` says more existed). With `security.view` `advisories` lists them and `detailed` is true; without it `advisories` is empty and only the counts are returned."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentSecurityContext'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/rollouts:
    get:
      operationId: listSoftwareRollouts
      summary: Rollout overview of Deployments (F9 G4, keyset).
      description: "Needs `deployments.view`, `deployments.manage` or `deployments.execute` (403 otherwise). `status` is a comma-separated list of Deployment statuses (400 for an unknown one); the default is the active rollouts (resolving_targets, ready, running, paused, scheduled). Newest first. Each row carries the current ring and target counts by state."
      security:
        - sessionAuth: []
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RolloutPage'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/capabilities:
    get:
      operationId: getRemoteAccessCapabilities
      summary: Remote access availability for a Device.
      description: "Needs `remote_access.view`, `remote_access.start_attended` or `remote_access.admin`. Reports, per enabled provider, whether a peer is mapped and whether an attended session could start, with refusal codes in `reasons` (see `RemoteAccessRefusalCode`). Peer ids are masked beyond their last three characters unless the caller holds `remote_access.admin`. The response is `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - {name: deviceId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Capabilities.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessCapabilities'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/sessions:
    get:
      operationId: listRemoteAccessSessions
      summary: List Remote Access Sessions.
      description: "Needs `remote_access.start_attended` (own sessions only) or `remote_access.view_sessions` (all sessions). Newest first, keyset paged. `no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: status, in: query, schema: {$ref: '#/components/schemas/RemoteAccessSessionStatus'}}
        - {name: deviceId, in: query, schema: {type: string, format: uuid}}
        - {name: ticketId, in: query, schema: {type: string, format: uuid}}
        - {name: initiatedBy, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessSessionPage'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: requestRemoteAccessSession
      summary: Request an attended Remote Access Session.
      description: "Needs `remote_access.start_attended`. Policy gates answer 409 with `remoteaccess.<code>` for each code of `RemoteAccessRefusalCode` (a refusal never creates a session; `ticket_unavailable` and `no_recipient` are possible here). Refused attempts count toward the rate limit: 429 `remoteaccess.rate_limited` after 20 requests per User and hour. The initiator must hold `tickets.manage` or be the Ticket assignee and not its reporter; at most one open session per Device. A mismatch `reason` always yields `pending_approval`, so an approver is required (`approver_required` otherwise). `note` is plain text (500 characters) and never audited. Devices whose ownership requires approval need exactly one of `approverUserId` or `approverTeamId`; the session then starts in `pending_approval`, otherwise it is authorized at once."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteAccessSessionRequest'}
      responses:
        '201':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessSession'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '409': {$ref: '#/components/responses/RemoteAccessConflict'}
        '429':
          description: remoteaccess.rate_limited.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/sessions/{id}:
    get:
      operationId: getRemoteAccessSession
      summary: One Remote Access Session with its transitions.
      description: "Visible to the initiator, holders of `remote_access.view_sessions` and the named approvers. `no-store`. Provider-observed fields (`observed*`) are reported by the provider with source and observation time; null means unknown and is never inferred."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessSessionDetail'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/sessions/{id}/launch:
    post:
      operationId: launchRemoteAccessSession
      summary: Issue the one-time launch handle.
      description: "Needs `remote_access.start_attended`; initiator only, session `authorized`. Returns the handle token exactly once: 256-bit random, base64url, valid 60 seconds, bound to the caller, only its SHA-256 is stored, at most one valid handle per session (409 `remoteaccess.handle_active` while one is valid). The token is not a provider credential and carries no launch link; resolve it with `/remote-access/launch-handles/exchange`. Never log the token. `no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteAccessVersionRequest'}
      responses:
        '200':
          description: The one-time handle.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessLaunchHandle'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '409': {$ref: '#/components/responses/RemoteAccessConflict'}
        '410':
          description: remoteaccess.handle_expired - the session expired.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/sessions/{id}/consent:
    post:
      operationId: recordRemoteAccessConsent
      summary: Record the user's consent decision.
      description: "Needs `remote_access.start_attended`; initiator only. `decision` is `granted` or `declined`; consent can be recorded once (409 `remoteaccess.consent_recorded`). Declining ends the session. Consent is separate from authorization and from provider records."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteAccessConsentRequest'}
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessSession'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '409': {$ref: '#/components/responses/RemoteAccessConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/sessions/{id}/close:
    post:
      operationId: closeRemoteAccessSession
      summary: Close a launched session.
      description: "Needs `remote_access.start_attended`; initiator only, session `launched`. `reason` is one of `completed`, `technician_aborted`, `connection_failed`, `other`. Turaco never infers an end from provider data."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteAccessReasonRequest'}
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessSession'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '409': {$ref: '#/components/responses/RemoteAccessConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/sessions/{id}/cancel:
    post:
      operationId: cancelRemoteAccessSession
      summary: Cancel a session that was not launched.
      description: "Needs `remote_access.start_attended`; initiator only, session `requested`, `pending_approval` or `authorized`. `reason` is one of `no_longer_needed`, `wrong_device`, `ticket_resolved`, `other`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteAccessReasonRequest'}
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessSession'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '409': {$ref: '#/components/responses/RemoteAccessConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/launch-handles/exchange:
    post:
      operationId: exchangeRemoteAccessLaunchHandle
      summary: Exchange a launch handle for the provider launch link, once.
      description: "Needs `remote_access.start_attended`. The only response that carries `launchUri`, in the body only; never put it in a redirect, URL, log or storage, and hand it to the browser at once (custom scheme). The handle works once for the User it was issued to: unknown token or other User 404, used 409 `remoteaccess.handle_used`, expired 410 `remoteaccess.handle_expired`, provider failure 502 `remoteaccess.launch_failed` (the session becomes `failed`). Moves the session to `launched`. Policy is re-checked: `mapping_changed`, `ticket_unavailable`, `device_retired`, `stale_device`, `holder_mismatch`, `approval_required` and `no_recipient` answer 409, consume the handle and end the session as `failed` with that code as `statusReason`. `no-store`."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteAccessExchangeRequest'}
      responses:
        '200':
          description: The launch link and the session.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessExchange'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '409': {$ref: '#/components/responses/RemoteAccessConflict'}
        '410':
          description: remoteaccess.handle_expired.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: remoteaccess.launch_failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/observations/summary:
    get:
      operationId: getRemoteAccessObservationsSummary
      summary: Provider observation records that could not be attributed to a session.
      description: "Needs `remote_access.view_sessions`. Counts only; unmatched provider records never create or change sessions. `no-store`."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessObservationsSummary'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /remote-access/peer-mappings:
    get:
      operationId: listRemoteAccessPeerMappings
      summary: Provider peer mappings of a Device.
      description: "Needs `remote_access.view`, `remote_access.start_attended` or `remote_access.admin`. Peer ids are masked beyond their last three characters unless the caller holds `remote_access.admin`. `no-store`."
      security:
        - sessionAuth: []
      parameters:
        - {name: deviceId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: includeClosed, in: query, description: Include replaced and removed mappings (history)., schema: {type: boolean}}
      responses:
        '200':
          description: Mappings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessPeerMappingList'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: mapRemoteAccessPeer
      summary: Map a Device to a provider peer.
      description: "Needs `remote_access.admin`. Replaces the active mapping of the Device for that provider (the old row is closed and kept). One active Device per peer id (409 `remoteaccess.peer_taken`). Audited with ids and reason codes only, never the peer id. Mapping is by explicit administrator action, never by hostname."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoteAccessPeerMappingRequest'}
      responses:
        '200':
          description: The mapping.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemoteAccessPeerMapping'}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '409': {$ref: '#/components/responses/RemoteAccessConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: unmapRemoteAccessPeer
      summary: Remove the active peer mapping of a Device.
      description: "Needs `remote_access.admin`. The mapping row is closed and kept. Audited."
      security:
        - sessionAuth: []
      parameters:
        - {name: deviceId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: provider, in: query, required: true, schema: {type: string}}
        - {name: reason, in: query, required: true, description: "One of no_longer_valid, wrong_device, decommissioned, other.", schema: {type: string}}
      responses:
        '204': {description: Removed.}
        '400': {$ref: '#/components/responses/RemoteAccessInvalid'}
        '404': {$ref: '#/components/responses/RemoteAccessNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/status:
    get:
      operationId: getPresenceStatus
      summary: Whether Workforce Presence is on and which Presence permissions the caller holds.
      description: "Any signed-in User. Mounted even when PRESENCE_ENABLED is false so clients can hide every Presence surface. `no-store`."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceStatus'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/settings:
    get:
      operationId: getPresenceSettings
      summary: Presence settings.
      description: "Needs `presence.admin`. Dates only: no free text."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceSettings'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: updatePresenceSettings
      summary: Replace the Presence settings (runtime switch, recorded DPIA and works-council dates, retention).
      description: "Needs `presence.admin`; `expectedVersion` required. Enabling the module (`enabled=true`) always needs `dpiaRecordedOn` (`presence.invalid_request`); `councilConfirmedOn` is recorded when given. Switching off starts the retention clock for every entry. Audited (`presence.settings.updated`)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceSettingsRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceSettings'}
        '409': {$ref: '#/components/responses/PresenceConflict'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/settings/purge:
    post:
      operationId: purgePresenceNow
      summary: Delete every Presence entry at once.
      description: "Needs `presence.admin`. Audited with the count only."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedEntries: {type: integer}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/me/entries:
    get:
      operationId: listMyPresenceEntries
      summary: Own entries with occurrences in a window.
      description: "Needs `presence.manage_own`. Window of at most 31 days starting no earlier than yesterday (`presence.window_too_large`). `presence.disabled` (404) when the module is off."
      security:
        - sessionAuth: []
      parameters:
        - {name: from, in: query, required: true, description: "RFC 3339 time or YYYY-MM-DD. Not earlier than now minus one day.", schema: {type: string}}
        - {name: to, in: query, required: true, description: "At most 31 days after `from`.", schema: {type: string}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceEntryList'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '422': {$ref: '#/components/responses/PresenceTooManyEntries'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/entries:
    get:
      operationId: listPresenceEntries
      summary: Entry details of other Users in the callers Teams.
      description: "Needs `presence.view_entries`. Only entries whose owner allowed detail visibility (or that the caller entered) are returned. Every read is audited (viewer, scope, count; never content)."
      security:
        - sessionAuth: []
      parameters:
        - {name: userId, in: query, schema: {type: string, format: uuid}}
        - {name: teamId, in: query, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, description: "RFC 3339 time or YYYY-MM-DD. Not earlier than now minus one day.", schema: {type: string}}
        - {name: to, in: query, required: true, description: "At most 31 days after `from`.", schema: {type: string}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceEntryList'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '422': {$ref: '#/components/responses/PresenceTooManyEntries'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createPresenceEntry
      summary: Create an entry (operation Create).
      description: "Needs `presence.manage_own` for oneself, `presence.manage_entries` for a Team member. There is no reason or note field. Kinds: `work_location` (locationType `location`, `remote`, `travelling`) or `unavailable`. Timed (`startsAt`/`endsAt`) or all-day (`startDate`/`endDate` + `timezone`). A recurrence needs an `endsOn` and lasts at most 366 days (`presence.invalid_recurrence`)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceEntryRequest'}
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceEntry'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/entries/{id}/reschedule:
    post:
      operationId: reschedulePresenceEntry
      summary: Move an entry in time (operation Reschedule).
      description: "Own entry (`presence.manage_own`) or an entry of a Team member (`presence.manage_entries`); others are not found. `expectedVersion` required. Externally sourced entries are read-only (`presence.read_only`). Audited."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceRescheduleRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceEntry'}
        '409': {$ref: '#/components/responses/PresenceConflict'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/entries/{id}/change-location:
    post:
      operationId: changePresenceEntryLocation
      summary: Change where a work location entry is (operation ChangeLocation).
      description: "Own entry (`presence.manage_own`) or an entry of a Team member (`presence.manage_entries`); others are not found. `expectedVersion` required. Externally sourced entries are read-only (`presence.read_only`). Audited."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceChangeLocationRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceEntry'}
        '409': {$ref: '#/components/responses/PresenceConflict'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/entries/{id}/change-recurrence:
    post:
      operationId: changePresenceEntryRecurrence
      summary: Set, replace or remove (null) the recurrence (operation ChangeRecurrence).
      description: "Own entry (`presence.manage_own`) or an entry of a Team member (`presence.manage_entries`); others are not found. `expectedVersion` required. Externally sourced entries are read-only (`presence.read_only`). Audited."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceChangeRecurrenceRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceEntry'}
        '409': {$ref: '#/components/responses/PresenceConflict'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/entries/{id}/cancel:
    post:
      operationId: cancelPresenceEntry
      summary: Cancel an entry (operation Cancel, terminal).
      description: "Own entry (`presence.manage_own`) or an entry of a Team member (`presence.manage_entries`); others are not found. `expectedVersion` required. Externally sourced entries are read-only (`presence.read_only`). Audited."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceVersionRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceEntry'}
        '409': {$ref: '#/components/responses/PresenceConflict'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/availability:
    get:
      operationId: getPresenceAvailability
      summary: Operational Availability of up to 50 Users at an instant.
      description: "Needs `presence.view_availability` for Users other than oneself; Users outside the callers Teams are `unknown` with explanation `out_of_scope`. `unknown` is never shown as available; every value lists its sources with freshness."
      security:
        - sessionAuth: []
      parameters:
        - {name: userIds, in: query, required: true, description: Comma-separated user ids., schema: {type: string}}
        - {name: at, in: query, schema: {type: string}}
        - {name: onSite, in: query, schema: {type: boolean}}
        - {name: locationId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceAvailabilityList'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '422': {$ref: '#/components/responses/PresenceTooManyEntries'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/availability/window:
    get:
      operationId: getPresenceAvailabilityWindow
      summary: Operational Availability of one User across a window as contiguous segments.
      description: "Same scope rules as `/presence/availability`."
      security:
        - sessionAuth: []
      parameters:
        - {name: userId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, description: "RFC 3339 time or YYYY-MM-DD. Not earlier than now minus one day.", schema: {type: string}}
        - {name: to, in: query, required: true, description: "At most 31 days after `from`.", schema: {type: string}}
        - {name: onSite, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceAvailabilityWindow'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '422': {$ref: '#/components/responses/PresenceTooManyEntries'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/teams/{id}/coverage:
    get:
      operationId: getPresenceTeamCoverage
      summary: Team Coverage counts per day at 12:00 local time.
      description: "Needs `presence.view_availability` and current membership of the Team. A Team below two members is `unknown` with no days. Each day counts the members the Team had on that day (membership intervals), not today's members; a day with fewer than two members has no counts. Names (`unavailableUserIds`) appear only for `presence.view_entries` holders and only for entries their owners made visible; naming is audited (`presence.entries.detail_viewed`). `presence.too_many_entries` (422) when the window holds too many entries to answer completely."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - {name: from, in: query, required: true, description: "RFC 3339 time or YYYY-MM-DD. Not earlier than now minus one day.", schema: {type: string}}
        - {name: to, in: query, required: true, description: "At most 31 days after `from`.", schema: {type: string}}
        - {name: timezone, in: query, description: IANA zone of the day boundaries (default UTC)., schema: {type: string}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceTeamCoverage'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '422': {$ref: '#/components/responses/PresenceTooManyEntries'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /presence/teams/{id}/minimum:
    get:
      operationId: getPresenceTeamMinimum
      summary: Coverage minimum of the Team.
      description: "Needs `presence.manage_teams`, or `presence.view_availability` for a member."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  minimum:
                    oneOf:
                      - {$ref: '#/components/schemas/PresenceTeamMinimum'}
                      - {type: 'null'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: setPresenceTeamMinimum
      summary: Set the coverage minimum of the Team.
      description: "Needs `presence.manage_teams`. `expectedVersion` is required when a minimum exists. Audited."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceTeamMinimumRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresenceTeamMinimum'}
        '409': {$ref: '#/components/responses/PresenceConflict'}
        '400': {$ref: '#/components/responses/PresenceInvalid'}
        '404': {$ref: '#/components/responses/PresenceNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /modules/status:
    get:
      operationId: getModulesStatus
      summary: Which modules are effectively on (any signed-in User).
      description: "Any signed-in User; only module keys and whether each is effectively on (switch on and no unmet precondition), so the UI can hide navigation. Core modules are listed as enabled. `no-store`. Requests to the routes of a module that is off answer 404 `platform.module_disabled` (anonymous callers still get 401). Status probes `/ai/status` and `/presence/status` stay reachable."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModulesStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/modules:
    get:
      operationId: listModules
      summary: Module overview with state, dependencies and blocked reasons.
      description: "Requires `modules.manage`. Reads the stored switches fresh (no cache). `state` is `enabled`, `disabled` (switch off) or `blocked` (switch on but a precondition of the module is unmet; it behaves as off). `blockedReason` is set whenever a precondition or a disabled required module prevents the module from being on, also while the switch is off: startup_gate_off, dpia_not_recorded, no_enabled_provider, no_providers_configured, runtime_setting_off (the module's own audited setting is off), dependency_disabled. `startupGates` names read-only environment variables. `version` is 0 until the switch was first changed. `no-store`."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModuleList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/modules/{key}/enable:
    post:
      operationId: enableModule
      summary: Switch an optional module on.
      description: "Requires `modules.manage`. Needs `expectedVersion` (the `version` read from the overview) and a `reasonCode`. Refused with 409 `platform.modules.requires_disabled` (with `error.blockers`) while a required module is off, 409 `platform.modules.blocked` while the module's own precondition is unmet (the switch never bypasses startup gates, privacy records or providers), 409 `platform.modules.version_conflict`, 409 `platform.modules.no_change`, 409 `platform.modules.not_switchable` for core modules and 404 `platform.modules.not_found`. Audited (platform.module.enabled) with the reason code. Takes effect without restart."
      security:
        - sessionAuth: []
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModuleSwitchRequest'}
      responses:
        '200':
          description: The module after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Module'}
        '400': {$ref: '#/components/responses/ModuleInvalid'}
        '404': {$ref: '#/components/responses/ModuleNotFound'}
        '409': {$ref: '#/components/responses/ModuleConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/modules/{key}/disable:
    post:
      operationId: disableModule
      summary: Switch an optional module off. No data is deleted.
      description: "Requires `modules.manage`. Same body and errors as enable; refused with 409 `platform.modules.required_by_enabled` (with `error.blockers`) while an enabled module requires it. A disabled module's API routes answer 404 `platform.module_disabled`, its background jobs are skipped (retention clean-up of Presence and AI still runs) and its data is kept. Audited (platform.module.disabled) with the reason code."
      security:
        - sessionAuth: []
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModuleSwitchRequest'}
      responses:
        '200':
          description: The module after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Module'}
        '400': {$ref: '#/components/responses/ModuleInvalid'}
        '404': {$ref: '#/components/responses/ModuleNotFound'}
        '409': {$ref: '#/components/responses/ModuleConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/status:
    get:
      operationId: getAiStatus
      summary: Whether the assistant is on, the active provider and the tools offered to the caller.
      description: "Any signed-in User; always mounted, even when AI_ENABLED is false. `enabled` is false (and provider, tools and usage are empty) unless the startup gate, the runtime switch and an enabled provider are on and the caller holds `ai.use`. `tools` lists only tools the caller may use with the active provider. `no-store`."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/conversations/messages:
    post:
      operationId: sendAiMessage
      summary: Send one plain user message and get the assistant answer.
      description: "Needs `ai.use`. The body carries only the new user text, an optional conversation id (omit to start one) and optional UI context records; there is no field for roles, system prompts, tool calls or earlier messages, and unknown fields are rejected. Roles, tool calls and tool results live in the server-held conversation (30 minutes idle, bound to the User, tenant and sign-in session). A conversation id of another User or session returns 404 `ai.not_found`. A tool call for a record the User has not named in this conversation is refused and returned in `scopeRequests`; the UI asks the User and then calls `/ai/conversations/scope`. Errors: `ai.rate_limited` and `ai.budget_exceeded` (429), `ai.provider_unavailable` (503), `ai.provider_changed` and `ai.turn_in_progress` (409), `ai.conversation_too_large` (422), `ai.disabled` (404). Audited with metadata only (no prompt or answer text)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiMessageRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiTurn'}
        '400': {$ref: '#/components/responses/AIInvalid'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '409': {$ref: '#/components/responses/AIConflict'}
        '429': {$ref: '#/components/responses/AILimited'}
        '503': {$ref: '#/components/responses/AIUnavailable'}
        '422': {$ref: '#/components/responses/AIConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/conversations/transcript:
    post:
      operationId: getAiTranscript
      summary: The user-visible messages of a conversation.
      description: "Needs `ai.use`. POST so the conversation id never appears in a URL or log. Returns user and assistant text only; tool calls and results never leave the server."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiConversationRef'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiTranscript'}
        '400': {$ref: '#/components/responses/AIInvalid'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/conversations/scope:
    post:
      operationId: consentAiResource
      summary: Allow the assistant to read one more record in this conversation.
      description: "Needs `ai.use`. Explicit per-record consent after a `scopeRequests` entry (design A11). The tool still checks the User's own permission for the record. Audited (`ai.scope.consented`)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiConsentRequest'}
      responses:
        '204': {description: No content.}
        '400': {$ref: '#/components/responses/AIInvalid'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '409': {$ref: '#/components/responses/AIConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/conversations/end:
    post:
      operationId: endAiConversation
      summary: Delete the server-held conversation.
      description: "Needs `ai.use`. Idempotent per id except that a second call returns 404."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiConversationRef'}
      responses:
        '204': {description: No content.}
        '400': {$ref: '#/components/responses/AIInvalid'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/settings:
    get:
      operationId: getAiSettings
      summary: "AI policy (runtime switch, retention and caps)."
      description: "Needs `ai.settings.view` or `ai.settings.manage`."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiSettings'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: updateAiSettings
      summary: Replace the AI policy.
      description: "Needs `ai.settings.manage`; `expectedVersion` required. Enabling needs an enabled provider. Audited with before and after (`ai.settings.updated`)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiSettingsRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiSettings'}
        '400': {$ref: '#/components/responses/AIInvalid'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '409': {$ref: '#/components/responses/AIConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/providers:
    get:
      operationId: listAiProviders
      summary: AI Providers (never secret material).
      description: "Needs `ai.settings.view` or `ai.settings.manage`. `secretRef` is the name of a deployment secret file; the secret itself is never stored or returned."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderList'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createAiProvider
      summary: Add an AI Provider.
      description: "Needs `ai.settings.manage`. The endpoint is validated (https; http only for `local`; no userinfo, query or special-range literal IP). An external provider needs `dpaRecordedOn`, `noTrainingConfirmed` and `region`. Without `allowedDataClasses` only `public_reference` is allowed. At most one provider can be `enabled` (400 otherwise). Audited (`ai.provider.created`), event `AIProviderChanged`. Credentials are not accepted in the body."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiProviderRequest'}
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProvider'}
        '400': {$ref: '#/components/responses/AIInvalid'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/providers/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updateAiProvider
      summary: Replace an AI Provider configuration.
      description: "Needs `ai.settings.manage`; `expectedVersion` required; the kind cannot change. Disabling the active provider switches the assistant off. Audited with before and after."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AiProviderRequest'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProvider'}
        '400': {$ref: '#/components/responses/AIInvalid'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '409': {$ref: '#/components/responses/AIConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/providers/{id}/test:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: testAiProvider
      summary: Send a fixed test prompt through the provider transport.
      description: "Needs `ai.settings.manage`. Returns a code only (`ok`, `provider_unavailable`), never provider content."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiProviderTest'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /ai/usage:
    get:
      operationId: getAiUsage
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 30}}
      summary: Aggregated AI usage per day (counts only).
      description: "Needs `ai.usage.view`. Query `days` 1 to 90 (default 30). `estimatedCostMicro` is millionths of the configured currency unit."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AiUsage'}
        '400': {$ref: '#/components/responses/AIInvalid'}
        '404': {$ref: '#/components/responses/AINotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: turaco_session
      description: Opaque server-side session token in an HttpOnly, SameSite=Lax cookie. The token is accepted from the cookie only.
  parameters:
    LineId:
      name: lineId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size, default 50; values above 200 are clamped to 200. Non-numeric or below 1 yields 400 `<module>.invalid_limit` (e.g. organization.invalid_limit, authorization.invalid_limit, audit.invalid_limit).
      schema: {type: integer, minimum: 1}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's nextCursor; pass it back unchanged. Invalid values yield 400 `<module>.invalid_cursor`.
      schema: {type: string}
    Query:
      name: q
      in: query
      description: Case-insensitive name prefix, at most 100 characters (else 400 organization.invalid_query).
      schema: {type: string, maxLength: 100}
    UserStatus:
      name: status
      in: query
      description: Exact status filter (else 400 organization.invalid_status).
      schema: {type: string, enum: [active, inactive, departed, external, unknown]}
    ProviderKey:
      name: providerKey
      in: query
      description: Exact directory provider key filter, at most 100 characters (else 400 organization.invalid_provider_key).
      schema: {type: string, maxLength: 100}
  responses:
    SecurityNotFound:
      description: Advisory or finding not found (security.not_found).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SecurityInvalid:
      description: Invalid body, assignee, reference, cursor or limit (security.invalid_request, security.invalid_reference, security.invalid_cursor, security.invalid_limit).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SecurityConflict:
      description: Duplicate advisory, stale version or invalid transition including a closed or ineligible remediation Task parent (security.duplicate, security.version_conflict, security.invalid_transition).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PlanningNotFound:
      description: Initiative or milestone absent or not visible (planning.not_found).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PlanningInvalid:
      description: Invalid input, reference, cursor or range (planning.invalid_request, planning.invalid_reference, planning.invalid_cursor, planning.invalid_limit).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PlanningConflict:
      description: Stale version, invalid transition, ineligible approver or limit reached (planning.version_conflict, planning.invalid_transition, planning.no_eligible_approver, planning.limit_reached).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChangesForbidden:
