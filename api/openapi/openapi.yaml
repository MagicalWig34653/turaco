          type: string
        externalId:
          type: string
        displayName:
          type: string
        description:
          type: [string, "null"]
        firstObservedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        deletedObservedAt:
          type: [string, "null"]
          format: date-time
    DirectoryGroupMember:
      type: object
      additionalProperties: false
