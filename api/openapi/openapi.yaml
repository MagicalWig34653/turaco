      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GoodsReceipt'}
        nextCursor: {type: string}
    GoodsReceiptCreate:
      type: object
      additionalProperties: false
      required: [orderId, lines]
      properties:
        orderId: {type: string, format: uuid}
        deliveryNote: {type: string, maxLength: 100}
        assetsAvailable: {type: boolean, description: "Register new assets as available instead of received (still to be checked)."}
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [orderLineId, quantity]
            properties:
              orderLineId: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1, maximum: 1000000}
              storageLocationId: {type: string, format: uuid, description: "Required for quantity-tracked products."}
              units:
                type: array
                description: "Serialized products: one entry per piece."
                items:
                  type: object
                  additionalProperties: false
                  required: [serialNumber]
                  properties:
                    serialNumber: {type: string, maxLength: 100}
                    assetTag: {type: string, maxLength: 50}
              assetLocationId: {type: string, format: uuid}
              warrantyUntil: {type: string, format: date}
    TaskCreate:
