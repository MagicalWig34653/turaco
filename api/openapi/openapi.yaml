        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/versions:
    get:
      operationId: listSoftwareVersions
      summary: List Software Versions.
      description: "Needs `software.view`, `software.approve` or `software.package`; callers without any of them get 403. Invalid status yields 400 endpoints.invalid_request."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: productId, in: query, description: 'Only versions of this Software Product.', schema: {type: string, format: uuid}}
        - {name: status, in: query, description: 'Exact version approval status.', schema: {type: string, enum: [registered, pending, approved, rejected, revoked]}}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareVersionList'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: registerSoftwareVersion
      summary: Register a Software Version binding.
      description: "Needs `software.package` (elevated). A Software Version is an immutable binding of version string, installer SHA-256, https installer URL, publisher, install command and detection rule; the server stores SHA-256s of the command and the rule and a binding SHA-256 over all of them. Registration is idempotent per binding (200 with the existing version, 201 when created); any changed field is a new version that needs its own approval. Refused while the product is blocked or retired (409 endpoints.product_blocked). Bodies above 32 KiB, a hash that is not 64 hexadecimal characters, a non-https URL or text with control characters yield 400. The registrant can never approve this version. Audited with ids, statuses, hashes and reason codes only."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionRegister'}
      responses:
        '201':
          description: The version was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareVersion'}
        '200':
          description: The existing version with the same binding.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareVersion'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '404': {$ref: '#/components/responses/SoftwareNotFound'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/versions/{id}:
    get:
      operationId: getSoftwareVersion
      summary: Get a Software Version with its approval history and packages.
      description: "Needs `software.view`, `software.approve` or `software.package`; callers without any of them get 403. The approval history is append-only; each decision records the installer and binding hash it was made for."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareVersionDetail'}
        '404': {$ref: '#/components/responses/SoftwareNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/versions/{id}/request-approval:
    post:
      operationId: requestSoftwareVersionApproval
      summary: Request approval (registered to pending).
      description: "Needs `software.package` (elevated). `expectedVersion` is required (400 endpoints.invalid_request when missing; 409 endpoints.version_conflict when stale). Takes no reason. Refused while the product is blocked or retired (409 endpoints.product_blocked). Holders of `software.approve` other than the requester are notified (software.approval_requested). Not allowed from the current status yields 409 endpoints.invalid_transition. Audited with ids, statuses, hashes and reason codes only."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionRequest'}
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareVersion'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '404': {$ref: '#/components/responses/SoftwareNotFound'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/versions/{id}/approve:
    post:
      operationId: approveSoftwareVersion
      summary: Approve a version (pending to approved).
      description: "Needs `software.approve` (elevated). `expectedVersion` is required (400 endpoints.invalid_request when missing; 409 endpoints.version_conflict when stale). Takes no reason. Separation of duties: the person who registered the version or requested its approval cannot approve it (403 endpoints.separation_of_duties). The approval binds to the version binding and installer hash. Not allowed from the current status yields 409 endpoints.invalid_transition. Audited with ids, statuses, hashes and reason codes only."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionRequest'}
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareVersion'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '404': {$ref: '#/components/responses/SoftwareNotFound'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/versions/{id}/reject:
    post:
      operationId: rejectSoftwareVersion
      summary: Reject a version (pending to rejected).
      description: "Needs `software.approve` (elevated). `expectedVersion` is required (400 endpoints.invalid_request when missing; 409 endpoints.version_conflict when stale). Reason code: hash_unverified, untrusted_source, license, security_risk, policy, other. Not allowed from the current status yields 409 endpoints.invalid_transition. Audited with ids, statuses, hashes and reason codes only."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionReject'}
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareVersion'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '404': {$ref: '#/components/responses/SoftwareNotFound'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/versions/{id}/revoke:
    post:
      operationId: revokeSoftwareVersion
      summary: Revoke an approval (approved to revoked).
      description: "Needs `software.approve` (elevated). `expectedVersion` is required (400 endpoints.invalid_request when missing; 409 endpoints.version_conflict when stale). Reason code: security_risk, defect, superseded, policy, other. Not allowed from the current status yields 409 endpoints.invalid_transition. Audited with ids, statuses, hashes and reason codes only."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionRevoke'}
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareVersion'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '404': {$ref: '#/components/responses/SoftwareNotFound'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/versions/{id}/package:
    post:
      operationId: packageSoftwareVersion
      summary: Package an approved version at the Software Management Provider.
      description: "Needs `software.package` (elevated). `expectedVersion` is required (400 endpoints.invalid_request when missing; 409 endpoints.version_conflict when stale). `expectedVersion` is the Software Version's version. Requires an approved version (409 endpoints.version_not_approved) of an approved product (409 endpoints.product_not_approved). One package per provider and version; the provider is called with the idempotency key `versionId:installerSha256`, so a retry cannot create a second package. A `failed` package can be packaged again; this increments `packageAttempt`. 409 endpoints.software_provider_not_configured when no provider is configured. Audited with ids, statuses, hashes and reason codes only."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionRequest'}
      responses:
        '200':
          description: The package.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwarePackage'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '404': {$ref: '#/components/responses/SoftwareNotFound'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/catalog/search:
    get:
      operationId: searchSoftwareCatalog
      summary: Search the Software Management Provider's catalog.
      description: "Needs `software.view`, `software.approve` or `software.package`; callers without any of them get 403. `q` must be 2-100 characters without control characters (400 otherwise). At most 50 results; provider data is sanitized and entries that fail sanitization are dropped; `sourceUrl` is https only. 409 endpoints.software_provider_not_configured when no provider is configured. At most 10 searches per user and minute (429 endpoints.software_rate_limited)."
      security:
        - sessionAuth: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
      responses:
        '200':
          description: Catalog entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwareCatalogList'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '429':
          description: endpoints.software_rate_limited - more than 10 catalog searches by this user in the last minute.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/packages:
    get:
      operationId: listSoftwarePackages
      summary: List Software Packages.
      description: "Needs `software.view`, `software.approve` or `software.package`; callers without any of them get 403. Invalid status yields 400 endpoints.invalid_request."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: status, in: query, description: 'Exact package status.', schema: {type: string, enum: [requested, building, packaged, published, failed]}}
        - {name: versionId, in: query, description: 'Only packages of this Software Version.', schema: {type: string, format: uuid}}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwarePackageList'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/packages/sync:
    post:
      operationId: syncSoftwarePackages
      summary: Read package status from the Software Management Provider now.
      description: "Needs `software.package` (elevated). Takes no body. Updates status and the provider-reported installer hash with source and freshness, raises or resolves the package findings `package_hash_mismatch` and `package_published_after_revoke` and links the published Management Artifact once the management sync has ingested it. 409 endpoints.software_sync_disabled when the synchronization is switched off, 409 endpoints.software_provider_not_configured without a provider. At most one manual run per 30 seconds (429 endpoints.software_sync_cooldown). Audited."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Counts of the run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwarePackageSyncResult'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '429':
          description: endpoints.software_sync_cooldown - a manual package synchronization ran less than 30 seconds ago.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /software/packages/{id}/publish:
    post:
      operationId: publishSoftwarePackage
      summary: Publish a packaged Software Package to the Management Provider.
      description: "Needs `software.package` (elevated). `expectedVersion` is required (400 endpoints.invalid_request when missing; 409 endpoints.version_conflict when stale). `expectedVersion` is the package's version. Requires the package to be packaged (409 endpoints.package_not_ready), the version approved and not revoked and the product approved, and the provider-reported installer hash to equal the approved hash (409 endpoints.hash_mismatch). Idempotency key `packageId:publish:installerSha256`; publishing an already published package returns it unchanged. 409 endpoints.software_provider_not_configured without a provider. Audited with ids, statuses, hashes and reason codes only."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionRequest'}
      responses:
        '200':
          description: The package.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SoftwarePackage'}
        '400': {$ref: '#/components/responses/SoftwareInvalid'}
        '404': {$ref: '#/components/responses/SoftwareNotFound'}
        '409': {$ref: '#/components/responses/SoftwareConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /target-sets:
    get:
      operationId: listTargetSets
      summary: List Target Sets.
      description: "Needs `deployments.view`, `deployments.manage` or `deployments.execute` (403 otherwise). Sorted by name, keyset paged. Archived Target Sets are left out unless `includeArchived=true`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: includeArchived, in: query, description: 'Include archived Target Sets.', schema: {type: boolean}}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSetList'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createTargetSet
      summary: Create a Target Set.
      description: "Needs `deployments.manage` (elevated). The definition is decoded strictly (unknown fields at any depth are 400 endpoints.invalid_request), validated, normalized (sorted, de-duplicated, lower-case ids) and stored canonically (at most 64 KiB; request body at most 96 KiB). A definition without filters and without explicit includes selects every Device (`allDevices`), which makes every plan using it high impact. `ownerUserId` defaults to the caller. Device ids, groups or asset locations in the definition need `endpoints.view` (403 platform.forbidden). A new Target Set takes no `expectedVersion` (400). Names are unique (409 endpoints.target_set_name_taken). Audited with ids and counts only; emits `TargetSetChanged`."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TargetSetWrite'}
      responses:
        '201':
          description: The created Target Set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSet'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /target-sets/{id}:
    get:
      operationId: getTargetSet
      summary: Get a Target Set.
      description: "Needs a session; holders of `deployments.view`, `deployments.manage` or `deployments.execute` and approvers of a plan using the set may read it (403 otherwise). Without `endpoints.view`, `includeDeviceIds` and `excludeDeviceIds` are empty and `deviceListsRedacted` is true; the counts remain."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The Target Set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSet'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateTargetSet
      summary: Replace a Target Set's name, description, owner and definition.
      description: "Needs `deployments.manage` (elevated). PATCH replaces the full editable state (send every field); `expectedVersion` is required (400 when missing, 409 endpoints.version_conflict when stale). The definition rules of create apply, including the `endpoints.view` rule. A Target Set used by a submitted, approved or scheduled Deployment cannot change (409 endpoints.target_set_in_use); an archived one cannot change either (409 endpoints.invalid_transition). Audited; emits `TargetSetChanged`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TargetSetWrite'}
      responses:
        '200':
          description: The updated Target Set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSet'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /target-sets/{id}/archive:
    post:
      operationId: archiveTargetSet
      summary: Archive a Target Set.
      description: "Needs `deployments.manage` (elevated) and `expectedVersion`. Target Sets are never deleted. A Target Set used by a submitted, approved or scheduled Deployment cannot be archived (409 endpoints.target_set_in_use); draft plans that use it report `target_set_archived` as a blocking issue. Audited; emits `TargetSetChanged`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionRequest'}
      responses:
        '200':
          description: The archived Target Set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSet'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /target-sets/{id}/evaluate:
    get:
      operationId: evaluateTargetSet
      summary: Evaluate a Target Set now (bounded preview).
      description: "Needs a session; the readers of GET /target-sets/{id} may evaluate (403 otherwise). 429 endpoints.evaluation_busy when too many evaluations run. Evaluates the stored definition over the live Devices of the endpoint provider in keyset batches of 1000: at most 50 000 Devices are scanned and at most `cap` (5000) matches kept. `truncated` means more Devices matched or existed, so counts are lower bounds; `incomplete` means a nested Directory Group or Asset location lookup was cut, so Devices may be missing. At most 10 example Devices, only for callers with `endpoints.view` that read through a deployments permission (otherwise `examples` is empty and `examplesRedacted` is true). Nothing is stored; G3 snapshots targets when a ring starts."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The evaluation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSetEvaluation'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '429': {$ref: '#/components/responses/DeploymentsBusy'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /target-sets/{id}/explain:
    get:
      operationId: explainTargetSet
      summary: Explain why one Device is or is not in a Target Set.
      description: "Needs `deployments.view`, `deployments.manage` or `deployments.execute`. Returns one result per clause that is set. An exclude always wins, an include matches regardless of filters, otherwise all set filters must match (AND; a list clause matches any of its values). A Device that is unknown, deleted or of another provider is 404. Needs `endpoints.view` too (403 platform.forbidden otherwise)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - {name: deviceId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The explanation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TargetSetExplanation'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments:
    get:
      operationId: listDeployments
      summary: List Deployment plans.
      description: "Needs a session. Holders of `deployments.view`, `deployments.manage` or `deployments.execute` see every plan; everybody else sees only the plans they own or created. Newest first, keyset paged. An invalid status is 400."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: status, in: query, schema: {$ref: '#/components/schemas/DeploymentStatus'}}
        - {name: productId, in: query, schema: {type: string, format: uuid}}
        - {name: versionId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentList'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createDeployment
      summary: Create a draft Deployment plan.
      description: "Needs `deployments.manage` (elevated); intent `uninstall` or `supersede: true` makes the plan high impact and additionally needs `deployments.high_impact` (403 endpoints.high_impact_required). `softwareVersionId` must name an existing Software Version (400) that is approved, of an approved product (409 endpoints.version_not_approved, endpoints.product_not_approved). `ownerUserId` defaults to the caller. A new plan takes no `expectedVersion` (400). Audited."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentWrite'}
      responses:
        '201':
          description: The draft plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}:
    get:
      operationId: getDeployment
      summary: Get a Deployment plan with rings, transitions, approvals, Change windows and structural validation.
      description: "Needs a session. Holders of a deployments permission read every plan; the owner, the creator and approvers of the plan Approval read theirs; everybody else gets 404. `validation` holds only the structural checks (`evaluated: false`, no ring counts); `POST validate` evaluates the rings. `changes` maps the Change ids of the rings to reference, status and window (read with the minimal read scope)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentDetail'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateDeployment
      summary: Change a draft plan's name, version, intent, supersede and owner.
      description: "Needs `deployments.manage` (elevated) and `expectedVersion`; only in `draft` (409 endpoints.invalid_transition otherwise). Send every field; an empty `ownerUserId` keeps the owner. Making or keeping the plan high impact needs `deployments.high_impact` (403 endpoints.high_impact_required); the version gate of create applies (409); 409 endpoints.editors_full when the plan has too many editors. Audited."
