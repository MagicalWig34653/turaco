        '409': {$ref: '#/components/responses/EndpointsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /management-artifacts/{id}/targets:
    get:
      operationId: getManagementArtifactTargets
      summary: Show assigned targets and expected and observed target counts.
      description: "Needs endpoint.management.view or endpoints.manage. Expected Applicable is Turaco-derived, not provider state. Group and User names require organization.directory.view. Device evaluation requires endpoints.view; User-held Devices also require assets.view."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Management view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactTargetsView'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '409': {$ref: '#/components/responses/EndpointsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /endpoint-sync:
    post:
      operationId: runEndpointSync
      summary: Ingest the provider's current device and management snapshots.
      description: "Needs `endpoints.manage` (it also covers the synchronization). 409 endpoints.sync_disabled when INTUNE_SYNC is off, 409 endpoints.provider_not_configured while no provider client exists, 409 endpoints.sync_running while another run of the provider is in progress. Every run is audited (endpoints.sync.completed or endpoints.sync.failed). Devices missing from the snapshot are tombstoned unless that would tombstone more than half of more than 10 live devices (reported as tombstonesSkipped). Management ingestion follows device ingestion; a management read or ingestion failure increments managementErrors (HTTP 200) without failing the device part. 429 endpoints.sync_cooldown when the provider's last completed sync finished less than 30 seconds ago."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EndpointSyncResult'}
        '409': {$ref: '#/components/responses/EndpointsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
