openapi: 3.1.0
info:
  title: Turaco API
  version: 0.1.0
  description: Bootstrap API contract. The implementation and OpenAPI contract must evolve together.
servers:
  - url: /api/v1
paths:
  /meta:
    get:
      operationId: getMeta
      summary: Return platform build/runtime metadata.
      responses:
        '200':
          description: Metadata response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
  /users:
    get:
      operationId: listUsers
      summary: List users.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/UserStatus'
      responses:
        '200':
          description: One page of results, ordered by id ascending (UUIDv7, roughly creation order).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`. Includes the directory accounts (external identities) linked to the user; the external subject and distinguished name are never exposed."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams:
    get:
      operationId: listTeams
      summary: List teams.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: One page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams/{id}:
    get:
      operationId: getTeam
      summary: Get a team.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      summary: List current members of a team.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /locations:
    get:
      operationId: listLocations
      summary: List locations.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: One page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /locations/{id}:
    get:
      operationId: getLocation
      summary: Get a location.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-groups:
    get:
      operationId: listDirectoryGroups
      summary: List observed directory groups.
      description: "Requires authentication and the `organization.directory.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: One page of results, ordered by id ascending. Includes groups no longer observed (`deletedObservedAt` set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryGroupList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-groups/{id}:
    get:
      operationId: getDirectoryGroup
      summary: Get an observed directory group.
      description: "Requires authentication and the `organization.directory.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryGroup'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-groups/{id}/members:
    get:
      operationId: listDirectoryGroupMembers
      summary: List currently observed members of a directory group.
      description: "Requires authentication and both `organization.directory.view` and `organization.view` (members are user identities). Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of currently observed members (open membership intervals), ordered by user id. Memberships that ended are not listed; `observedFrom` is the start of the current interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryGroupMemberList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-sync-runs:
    get:
      operationId: listDirectorySyncRuns
      summary: List directory synchronization runs.
      description: "Requires authentication and both `organization.directory.view` and `organization.view` (run conflicts carry directory usernames). Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ProviderKey'
      responses:
        '200':
          description: One page of runs, newest first (id descending, UUIDv7). Unlike other lists, `nextCursor` is the last (smallest) id of the page and the next page contains smaller ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorySyncRunList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: requestDirectorySync
      summary: Request a manual directory synchronization.
      description: "Requires authentication and the elevated `organization.directory.sync` permission. Enqueues a deduplicated background job (at most one active job per provider) and audits the request with the caller as actor; the worker performs the synchronization. Requests must be same-origin. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      responses:
        '202':
          description: "The job was enqueued (`created: true`) or an active job already exists (`created: false`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorySyncRequest'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Directory synchronization is not configured on this API instance (organization.directory_sync_not_configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-sync-runs/{id}:
    get:
      operationId: getDirectorySyncRun
      summary: Get a directory synchronization run.
      description: "Requires authentication and both `organization.directory.view` and `organization.view`. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorySyncRun'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Return the current authentication session.
      description: "Requires a valid `turaco_session` cookie. Responses are `Cache-Control: no-store`. `permissions` are the effective permissions from the user's role assignments (directly and through Directory Groups)."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      description: "Revokes the session in the `turaco_session` cookie and clears the cookie. Idempotent: without a valid session the cookie is still cleared and 204 is returned. Requests must be same-origin (`Sec-Fetch-Site` / `Origin`); otherwise 403 `platform.csrf_rejected`."
      responses:
        '204':
          description: Logged out; the session cookie is cleared.
        '403':
          description: Cross-origin request rejected (platform.csrf_rejected).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/methods:
    get:
      operationId: getAuthMethods
      summary: Report which login methods are configured.
      description: "Unauthenticated. The UI uses it to offer only configured methods. Responses are `Cache-Control: no-store`."
      responses:
        '200':
          description: Configured login methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethods'
  /auth/login:
    post:
      operationId: login
      summary: Log in with a directory username or email and password.
      description: "Verifies the password by binding to the directory as the synced account (LDAPS/StartTLS). On success a new session cookie is set and any session carried by the request is revoked. Every credential failure answers the same 401 after a minimum response time. Requests must be same-origin. See docs/security/identity-access-design.md §6."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Logged in; the session cookie is set.
        '400':
          description: Malformed request (auth.invalid_request), e.g. empty identifier or password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Invalid credentials (auth.invalid_credentials). Unknown, disabled and wrong-password accounts are indistinguishable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Cross-origin request rejected (platform.csrf_rejected).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Password login is not configured (auth.method_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Too many failed attempts for this identifier or client (auth.too_many_attempts); see Retry-After.
          headers:
            Retry-After:
              schema: {type: integer}
              description: Seconds until the lock expires.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: The directory cannot be reached (auth.provider_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/emergency-login:
    post:
      operationId: emergencyLogin
      summary: Log in with the local emergency (break-glass) account.
      description: "Exists only when AUTH_EMERGENCY_LOGIN_ENABLED=true; otherwise 404 auth.method_unavailable. Same throttling and generic errors as /auth/login. Sessions are capped at one hour. Every use is audited and logged at error level."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyLoginRequest'
      responses:
        '204':
          description: Logged in; the session cookie is set.
        '400':
          description: Malformed request (auth.invalid_request).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Invalid credentials (auth.invalid_credentials).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Cross-origin request rejected (platform.csrf_rejected).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Emergency login is disabled (auth.method_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Too many failed attempts (auth.too_many_attempts); see Retry-After.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/kerberos:
    get:
      operationId: kerberosLogin
      summary: Log in with Kerberos/SPNEGO (Windows integrated authentication).
      description: "404 auth.method_unavailable when Kerberos is not configured. Without an `Authorization: Negotiate` header the response is 401 with `WWW-Authenticate: Negotiate`; with a valid ticket for a synced, active account a session cookie is set (204). Implemented in F1 slice 4."
      responses:
        '204':
          description: Logged in; the session cookie is set.
        '401':
          description: Negotiation required or ticket rejected (auth.invalid_credentials).
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: "`Negotiate` when no ticket was sent."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Kerberos is not configured (auth.method_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
  /permissions:
    get:
      operationId: listPermissions
      summary: List all registered permissions.
      description: "Requires `platform.roles.view`."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: All permissions, sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /roles:
    get:
      operationId: listRoles
      summary: List roles.
      description: "Requires `platform.roles.view`. Not paginated (roles are few); sorted by name."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: All roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createRole
      summary: Create a custom role.
      description: "Requires `platform.roles.manage`. Audited (authorization.role.created)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: The created role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /roles/{id}:
    get:
      operationId: getRole
      summary: Get a role.
      description: "Requires `platform.roles.view`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateRole
      summary: Rename or redescribe a custom role.
      description: "Requires `platform.roles.manage`. The built-in role cannot be changed (409 authorization.built_in_role). Audited (authorization.role.updated)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleUpdate'}
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteRole
      summary: Delete a custom role without active assignments.
      description: "Requires `platform.roles.manage`. 409 authorization.role_in_use while active assignments exist, 409 authorization.built_in_role for the built-in role. Audited (authorization.role.deleted)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /roles/{id}/permissions:
    put:
      operationId: setRolePermissions
      summary: Replace the permissions of a custom role.
      description: "Requires `platform.roles.manage`. Every name must be registered (400 authorization.unknown_permission). Audited (authorization.role.permissions_changed) with before/after."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RolePermissionsUpdate'}
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /role-assignments:
    get:
      operationId: listRoleAssignments
      summary: List role assignments.
      description: "Requires `platform.roles.view`. Newest first (descending id). Active only unless includeRevoked=true."
      security:
        - sessionAuth: []
      parameters:
        - {name: roleId, in: query, schema: {type: string}}
        - {name: subjectType, in: query, schema: {type: string, enum: [user, directory_group]}}
        - {name: subjectId, in: query, schema: {type: string}}
        - {name: includeRevoked, in: query, schema: {type: boolean}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of assignments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAssignmentList'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: assignRole
      summary: Assign a role to a User or Directory Group (global scope).
      description: "Requires `platform.roles.manage`. The subject must exist (Directory Group not deleted); 409 authorization.duplicate_assignment for an existing active assignment. Audited (authorization.role.assigned)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleAssignmentCreate'}
      responses:
        '201':
          description: The created assignment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAssignment'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /role-assignments/{id}/revoke:
    post:
      operationId: revokeRoleAssignment
      summary: Revoke a role assignment.
      description: "Requires `platform.roles.manage`. Idempotent for already revoked assignments (200, no new audit). Revoking the last active platform-administrator assignment of a User is refused (409 authorization.last_administrator). Audited (authorization.role.assignment_revoked)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The revoked assignment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAssignment'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: Query the audit log.
      description: "Requires `platform.audit.view`. Newest first (descending id). `action` is exact, `actionPrefix` matches the beginning (e.g. `authorization.`); time bounds are RFC 3339 and half-open [from, to). Invalid filters yield 400 audit.invalid_filter."
      security:
        - sessionAuth: []
      parameters:
        - {name: targetType, in: query, schema: {type: string, maxLength: 100}}
        - {name: targetId, in: query, schema: {type: string, maxLength: 200}}
        - {name: action, in: query, schema: {type: string, maxLength: 200}}
        - {name: actionPrefix, in: query, schema: {type: string, maxLength: 200}}
        - {name: actorId, in: query, schema: {type: string}}
        - {name: correlationId, in: query, schema: {type: string, maxLength: 200}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of audit events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventList'}
        '400':
          description: Invalid filter or paging (audit.invalid_filter, audit.invalid_cursor, audit.invalid_limit).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: turaco_session
      description: Opaque server-side session token in an HttpOnly, SameSite=Lax cookie. The token is accepted from the cookie only.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size, default 50; values above 200 are clamped to 200. Non-numeric or below 1 yields 400 organization.invalid_limit.
      schema: {type: integer, minimum: 1}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's nextCursor. Invalid values yield 400 organization.invalid_cursor.
      schema: {type: string}
    Query:
      name: q
      in: query
      description: Case-insensitive name prefix, at most 100 characters (else 400 organization.invalid_query).
      schema: {type: string, maxLength: 100}
    UserStatus:
      name: status
      in: query
      description: Exact status filter (else 400 organization.invalid_status).
      schema: {type: string, enum: [active, inactive, departed, external, unknown]}
    ProviderKey:
      name: providerKey
      in: query
      description: Exact directory provider key filter, at most 100 characters (else 400 organization.invalid_provider_key).
      schema: {type: string, maxLength: 100}
  responses:
    InvalidRequest:
      description: Invalid limit, cursor, query, status or provider key (organization.invalid_limit, organization.invalid_cursor, organization.invalid_query, organization.invalid_status, organization.invalid_provider_key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Authentication is required (platform.unauthenticated).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing permission (platform.forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (organization.not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal error (platform.internal_error); the message never contains internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthorizationInvalid:
      description: Invalid input (authorization.invalid_request, authorization.unknown_permission, authorization.invalid_cursor, authorization.invalid_limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthorizationNotFound:
      description: Role, assignment or subject not found (authorization.not_found, authorization.subject_not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthorizationConflict:
      description: Conflict (authorization.duplicate_key, authorization.built_in_role, authorization.role_in_use, authorization.duplicate_assignment, authorization.last_administrator).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AuthSession:
      type: object
      additionalProperties: false
      required: [userId, authMethod, expiresAt, permissions]
      properties:
        userId: {type: string}
        authMethod: {type: string}
        expiresAt:
          type: string
          format: date-time
          description: Earlier of the idle and absolute expiry.
        permissions:
          type: array
          items: {type: string}
          description: Sorted effective permission names.
    Meta:
      type: object
      additionalProperties: false
      required: [name, version, environment]
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, displayName, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        givenName:
          type: [string, "null"]
        familyName:
          type: [string, "null"]
        primaryEmail:
          type: [string, "null"]
        status:
          type: string
          enum: [active, inactive, departed, external, unknown]
        departmentId:
          type: [string, "null"]
          format: uuid
        primaryLocationId:
          type: [string, "null"]
          format: uuid
        managerUserId:
          type: [string, "null"]
          format: uuid
        updatedAt:
          type: string
          format: date-time
    Team:
      type: object
      additionalProperties: false
      required: [id, name, active, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    TeamMember:
      type: object
      additionalProperties: false
      required: [userId, displayName, source, validFrom]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: [string, "null"]
        source:
          type: string
        validFrom:
          type: string
          format: date-time
    Location:
      type: object
      additionalProperties: false
      required: [id, name, active, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        externalKey:
          type: [string, "null"]
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    DirectoryGroup:
      type: object
      additionalProperties: false
      required: [id, providerKey, externalId, displayName, firstObservedAt, lastObservedAt]
      properties:
        id:
          type: string
          format: uuid
        providerKey:
          type: string
        externalId:
          type: string
        displayName:
          type: string
        description:
          type: [string, "null"]
        firstObservedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        deletedObservedAt:
          type: [string, "null"]
          format: date-time
    DirectoryGroupMember:
      type: object
      additionalProperties: false
      required: [userId, displayName, observedFrom, lastObservedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        observedFrom:
          type: string
          format: date-time
          description: Start of the current continuous observed interval.
        lastObservedAt:
          type: string
          format: date-time
    UserDetail:
      type: object
      additionalProperties: false
      required: [id, displayName, status, updatedAt, externalIdentities]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        givenName:
          type: [string, "null"]
        familyName:
          type: [string, "null"]
        primaryEmail:
          type: [string, "null"]
        status:
          type: string
          enum: [active, inactive, departed, external, unknown]
        departmentId:
          type: [string, "null"]
          format: uuid
        primaryLocationId:
          type: [string, "null"]
          format: uuid
        managerUserId:
          type: [string, "null"]
          format: uuid
        updatedAt:
          type: string
          format: date-time
        externalIdentities:
          type: array
          description: Directory accounts linked to the user, ordered by provider key. Not included in user lists.
          items:
            $ref: '#/components/schemas/ExternalIdentity'
    ExternalIdentity:
      type: object
      additionalProperties: false
      required: [providerKey, username, enabled, lastSeenAt, deletedObservedAt]
      properties:
        providerKey:
          type: string
        username:
          type: [string, "null"]
        enabled:
          type: boolean
          description: Whether the directory account is enabled as last observed.
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        deletedObservedAt:
          type: [string, "null"]
          format: date-time
          description: Set when the account was no longer observed in the directory; cleared when it reappears.
    SyncConflict:
      type: object
      additionalProperties: false
      required: [kind, externalId, username]
      properties:
        kind:
          type: string
          enum: [email_in_use, manager_unresolved, invalid_attributes]
        externalId:
          type: string
        username:
          type: string
    DirectorySyncRun:
      type: object
      additionalProperties: false
      required: [id, providerKey, jobId, trigger, startedAt, observedAt, finishedAt, outcome, counts, conflicts, conflictCount, error]
      properties:
        id:
          type: string
          format: uuid
        providerKey:
          type: string
        jobId:
          type: [string, "null"]
          format: uuid
          description: The platform job that executed the run; null when the run was not started by a job.
        trigger:
          type: string
          enum: [scheduled, manual]
        startedAt:
          type: string
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
          description: The time the directory snapshot was observed; null while running or when the fetch failed.
        finishedAt:
          type: [string, "null"]
          format: date-time
        outcome:
          type: string
          enum: [running, succeeded, failed, sweep_withheld]
          description: '`sweep_withheld` is a successful run in which the not-observed sweep of users and/or groups was withheld by the safeguard (too many objects missing from the snapshot); everything else in the snapshot was applied.'
        counts:
          type: object
          description: Counters of a run that applied a snapshot (usersObserved, usersCreated, usersUpdated, usersUnchanged, usersNotObserved, usersSweepWithheld, usersActivated, usersDeactivated, sessionsRevoked, groupsObserved, groupsCreated, groupsUpdated, groupsNotObserved, groupsSweepWithheld, membershipsOpened, membershipsClosed, nestingOpened, nestingClosed, unresolvedMembers). Empty for other outcomes.
          additionalProperties: {type: integer}
        conflicts:
          type: array
          description: At most 100 conflicts; `conflictCount` is the total.
          items:
            $ref: '#/components/schemas/SyncConflict'
        conflictCount:
          type: integer
        error:
          type: [string, "null"]
          description: Sanitized failure reason, at most 500 characters; never contains attribute values.
    DirectorySyncRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DirectorySyncRun'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.
    DirectorySyncRequest:
      type: object
      additionalProperties: false
      required: [jobId, created]
      properties:
        jobId:
          type: string
          format: uuid
        created:
          type: boolean
          description: False when an active job for the provider already existed.
    UserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.
    TeamList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.
    TeamMemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.
    LocationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.
    DirectoryGroupList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryGroup'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.
    DirectoryGroupMemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryGroupMember'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.
    AuthMethods:
      type: object
      additionalProperties: false
      required: [password, kerberos, emergency]
      properties:
        password: {type: boolean, description: Directory password login is configured.}
        kerberos: {type: boolean, description: Kerberos/SPNEGO is configured.}
        emergency: {type: boolean, description: Emergency login is enabled.}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: {type: string, minLength: 1, maxLength: 256, description: "Directory username, DOMAIN\\username or primary email."}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    EmergencyLoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    Permission:
      type: object
      additionalProperties: false
      required: [name, description, risk]
      properties:
        name: {type: string}
        description: {type: string}
        risk: {type: string, enum: [normal, elevated, high]}
    PermissionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Permission'}
    Role:
      type: object
      additionalProperties: false
      required: [id, key, name, description, builtIn, permissions, activeAssignments, createdAt, updatedAt]
      properties:
        id: {type: string}
        key: {type: string, description: "Stable slug, ^[a-z0-9][a-z0-9-]{1,62}$."}
        name: {type: string}
        description: {type: string}
        builtIn: {type: boolean}
        permissions:
          type: array
          items: {type: string}
          description: Sorted effective permissions; for the built-in platform-administrator role every registered permission.
        activeAssignments: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RoleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Role'}
    RoleCreate:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        permissions:
          type: array
          items: {type: string}
    RoleUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
    RolePermissionsUpdate:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          items: {type: string}
    RoleAssignment:
      type: object
      additionalProperties: false
      required: [id, roleId, roleKey, subjectType, subjectId, subjectDisplayName, scope, createdAt]
      properties:
        id: {type: string}
        roleId: {type: string}
        roleKey: {type: string}
        subjectType: {type: string, enum: [user, directory_group]}
        subjectId: {type: string}
        subjectDisplayName: {type: string, description: Current display name of the User or Directory Group; empty if unknown.}
        scope: {type: string, enum: [global]}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string, description: User id of the creator; omitted for CLI-created assignments.}
        revokedAt: {type: string, format: date-time}
        revokedBy: {type: string}
    RoleAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RoleAssignment'}
        nextCursor: {type: string}
    RoleAssignmentCreate:
      type: object
      additionalProperties: false
      required: [roleId, subjectType, subjectId]
      properties:
        roleId: {type: string}
        subjectType: {type: string, enum: [user, directory_group]}
        subjectId: {type: string}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, action, targetType, targetId, correlationId, metadata]
      properties:
        id: {type: string}
        occurredAt: {type: string, format: date-time}
        actorId: {type: string, description: Acting User; omitted for system/CLI actions (see metadata.actor).}
        action: {type: string}
        targetType: {type: string}
        targetId: {type: string}
        correlationId: {type: string}
        before: {description: State before the change, when recorded.}
        after: {description: State after the change, when recorded.}
        metadata: {type: object}
    AuditEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        nextCursor: {type: string}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, for example organization.not_found.
            message:
              type: string
            requestId:
              type: string
