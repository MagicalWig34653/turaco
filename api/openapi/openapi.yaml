        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '409': {$ref: '#/components/responses/RequestsConflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /service-requests/{id}/resume:
    post:
      operationId: resumeServiceRequest
      summary: Resume a request.
      description: "Requires `requests.manage`. Only a waiting request; it completes at once when its tasks finished meanwhile. Audited (requests.request.resumed)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskVersion'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceRequest'}
        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '409': {$ref: '#/components/responses/RequestsConflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /service-requests/{id}/complete:
    post:
      operationId: completeServiceRequest
      summary: Complete a request manually.
      description: "Requires `requests.manage`. Every fulfillment task must be finished; when a mandatory task was cancelled, a `reason` is required. Audited (requests.request.completed); emits ServiceRequestCompleted."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestReason'
      responses:
