openapi: 3.1.0
info:
  title: Turaco API
  version: 0.1.0
  description: Bootstrap API contract. The implementation and OpenAPI contract must evolve together.
servers:
  - url: /api/v1
paths:
  /meta:
    get:
      operationId: getMeta
      summary: Return platform build/runtime metadata.
      responses:
        '200':
          description: Metadata response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
  /users:
    get:
      operationId: listUsers
      summary: List users.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/UserStatus'
      responses:
        '200':
          description: One page of results, ordered by id ascending (UUIDv7, roughly creation order).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`. Includes the directory accounts (external identities) linked to the user; the external subject and distinguished name are never exposed."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams:
    get:
      operationId: listTeams
      summary: List teams.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: One page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createTeam
      summary: Create a team.
      description: "Requires `organization.teams.manage`. Audited (organization.team.created). The name must be unique among active teams (case-insensitive)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamName'
      responses:
        '201':
          description: The created team.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        '400': {$ref: '#/components/responses/OrganizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/OrganizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams/{id}:
    get:
      operationId: getTeam
      summary: Get a team.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: renameTeam
      summary: Rename a team.
      description: "Requires `organization.teams.manage`. Audited (organization.team.renamed)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamName'
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        '400': {$ref: '#/components/responses/OrganizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/OrganizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams/{id}/activate:
    post:
      operationId: activateTeam
      summary: Activate a team.
      description: "Requires `organization.teams.manage`. Audited (organization.team.activated). 409 when already active or its name is used by another active team."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        '400': {$ref: '#/components/responses/OrganizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/OrganizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams/{id}/deactivate:
    post:
      operationId: deactivateTeam
      summary: Deactivate a team.
      description: "Requires `organization.teams.manage`. Audited (organization.team.deactivated). Members are kept; no members can be added while inactive."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        '400': {$ref: '#/components/responses/OrganizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/OrganizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      summary: List current members of a team.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: addTeamMember
      summary: Add a member to a team.
      description: "Requires `organization.teams.manage`. Audited (organization.team.member_added). Only active users; the membership has source `platform`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberAdd'
      responses:
        '201':
          description: The new membership.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamMember'}
        '400': {$ref: '#/components/responses/OrganizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/OrganizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      summary: Remove a member from a team.
      description: "Requires `organization.teams.manage`. Audited (organization.team.member_removed). Ends the current membership; history is kept."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: userId
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Membership ended.
        '400': {$ref: '#/components/responses/OrganizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks.
      description: "Requires `tasks.view`, `tasks.manage` or `tasks.work`. Callers holding only `tasks.work` see only tasks assigned to them or one of their Teams; `mine=true` applies that restriction for others. Ordered by due date (undated last), priority (urgent first), id. Keyset paginated."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: One or more of open, in_progress, blocked, completed, cancelled (repeatable or comma-separated).
          schema: {type: string}
        - name: priority
          in: query
          schema: {type: string, enum: [low, normal, high, urgent]}
        - name: assignedUserId
          in: query
          schema: {type: string, format: uuid}
        - name: assignedTeamId
          in: query
          schema: {type: string, format: uuid}
        - name: overdue
          in: query
          description: Only `true`; unfinished tasks whose due date has passed.
          schema: {type: boolean}
        - name: mine
          in: query
          description: Only `true`.
          schema: {type: boolean}
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: One page of tasks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskList'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createTask
      summary: Create a task.
      description: "Requires `tasks.manage`. Audited (tasks.task.created); assigning on creation emits TaskAssigned."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: The created task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get a task.
      description: "Requires `tasks.view`, `tasks.manage` or `tasks.work`. Tasks the caller may not see are 404."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateTask
      summary: Change task details.
      description: "Requires `tasks.manage`. Title, description, priority and/or due date (`dueAt: null` clears it). Not allowed on completed or cancelled tasks. Audited (tasks.task.details_updated; changed field names only)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}/assign:
    post:
      operationId: assignTask
      summary: Assign a task.
      description: "Requires `tasks.manage`. Sets the assigned User and/or Team (an omitted side is cleared); both must be active. Audited (tasks.task.assigned); emits TaskAssigned. Assigning the current assignees is a no-op."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssign'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}/unassign:
    post:
      operationId: unassignTask
      summary: Clear the assignment of a task.
      description: "Requires `tasks.manage`. Audited (tasks.task.unassigned)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskVersion'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}/start:
    post:
      operationId: startTask
      summary: Start a task.
      description: "Requires `tasks.manage`, or `tasks.work` on a task assigned to the caller or one of its Teams (otherwise 404 if invisible, 403 if visible). Audited (tasks.task.started)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskVersion'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}/block:
    post:
      operationId: blockTask
      summary: Block a task.
      description: "Requires `tasks.manage`, or `tasks.work` on a task assigned to the caller or one of its Teams (otherwise 404 if invisible, 403 if visible). `reason` is required. Audited (tasks.task.blocked)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTransition'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}/unblock:
    post:
      operationId: unblockTask
      summary: Unblock a task.
      description: "Requires `tasks.manage`, or `tasks.work` on a task assigned to the caller or one of its Teams (otherwise 404 if invisible, 403 if visible). Audited (tasks.task.unblocked)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskVersion'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}/complete:
    post:
      operationId: completeTask
      summary: Complete a task.
      description: "Requires `tasks.manage`, or `tasks.work` on a task assigned to the caller or one of its Teams (otherwise 404 if invisible, 403 if visible). Audited (tasks.task.completed). Emits TaskCompleted."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskVersion'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      summary: Cancel a task.
      description: "Requires `tasks.manage`. `reason` is required. Audited (tasks.task.cancelled)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTransition'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /tasks/{id}/reopen:
    post:
      operationId: reopenTask
      summary: Reopen a completed or cancelled task.
      description: "Requires `tasks.manage`. `reason` is required. Audited (tasks.task.reopened)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTransition'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /recurring-task-definitions:
    get:
      operationId: listRecurringTaskDefinitions
      summary: List recurring task definitions.
      description: "Requires `tasks.recurrence.manage`. Oldest first, keyset paginated."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of definitions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecurringTaskDefinitionList'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createRecurringTaskDefinition
      summary: Create a recurring task definition.
      description: "Requires `tasks.recurrence.manage`. Audited (tasks.recurrence.created). The first run is the first occurrence after now."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecurringTaskDefinitionCreate'}
      responses:
        '201':
          description: The created definition.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecurringTaskDefinition'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /recurring-task-definitions/{id}:
    get:
      operationId: getRecurringTaskDefinition
      summary: Get a recurring task definition.
      description: "Requires `tasks.recurrence.manage`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The definition.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecurringTaskDefinition'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateRecurringTaskDefinition
      summary: Change a recurring task definition.
      description: "Requires `tasks.recurrence.manage`. Changing the rule reschedules an active definition from now. Audited (tasks.recurrence.updated; changed field names only)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecurringTaskDefinitionUpdate'}
      responses:
        '200':
          description: The updated definition.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecurringTaskDefinition'}
        '400': {$ref: '#/components/responses/TasksInvalid'}
        '404': {$ref: '#/components/responses/TasksNotFound'}
        '409': {$ref: '#/components/responses/TasksConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteRecurringTaskDefinition
      summary: Delete a recurring task definition.
      description: "Requires `tasks.recurrence.manage`. The tasks it generated stay. Audited (tasks.recurrence.deleted)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: expectedVersion
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '204':
          description: Deleted.
        '400': {$ref: '#/components/responses/TasksInvalid'}
