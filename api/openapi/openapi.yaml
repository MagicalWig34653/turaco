        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createAsset
      summary: Register an asset.
      description: "Needs `assets.manage`. Registers existing equipment (status `available`, or `received` to still check it). The product must be active and asset-managed; serialized products need a serial number. Audited (assets.asset.created); emits AssetCreated."
