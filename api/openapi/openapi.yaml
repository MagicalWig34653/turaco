          description: The updated asset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        '400': {$ref: '#/components/responses/AssetsInvalid'}
        '404': {$ref: '#/components/responses/AssetsNotFound'}
        '409': {$ref: '#/components/responses/AssetsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /assets/{id}/make-available:
    post:
      operationId: makeAssetAvailable
      summary: Make available.
      description: "Needs `assets.manage`. Allowed from: received or returned. Audited (assets.asset.*) with the reason; emits AssetAssigned, AssetReturned or AssetStatusChanged. 409 assets.invalid_transition otherwise."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
