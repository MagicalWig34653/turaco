            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '429': {$ref: '#/components/responses/DeploymentsBusy'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/cancel:
    post:
      operationId: cancelDeployment
      summary: Cancel a plan.
      description: "Needs `deployments.manage` (elevated), `expectedVersion` and a reason code. Allowed from every planning status except `cancelled` (409 endpoints.invalid_transition); a pending plan Approval is cancelled too. Plans are never deleted. Emits `DeploymentCancelled`; audited."
