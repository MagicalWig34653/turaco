  /locations/{id}:
    get:
      operationId: getLocation
      summary: Get a location.
      description: "Requires authentication and the `organization.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-groups:
    get:
      operationId: listDirectoryGroups
      summary: List observed directory groups.
      description: "Requires authentication and the `organization.directory.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: One page of results, ordered by id ascending. Includes groups no longer observed (`deletedObservedAt` set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryGroupList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-groups/{id}:
    get:
      operationId: getDirectoryGroup
      summary: Get an observed directory group.
      description: "Requires authentication and the `organization.directory.view` permission. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryGroup'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-groups/{id}/members:
    get:
      operationId: listDirectoryGroupMembers
      summary: List currently observed members of a directory group.
      description: "Requires authentication and both `organization.directory.view` and `organization.view` (members are user identities). Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of currently observed members (open membership intervals), ordered by user id. Memberships that ended are not listed; `observedFrom` is the start of the current interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryGroupMemberList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-sync-runs:
    get:
      operationId: listDirectorySyncRuns
      summary: List directory synchronization runs.
      description: "Requires authentication and both `organization.directory.view` and `organization.view` (run conflicts carry directory usernames). Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ProviderKey'
      responses:
        '200':
          description: One page of runs, newest first (id descending, UUIDv7). Unlike other lists, `nextCursor` is the last (smallest) id of the page and the next page contains smaller ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorySyncRunList'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: requestDirectorySync
      summary: Request a manual directory synchronization.
      description: "Requires authentication and the elevated `organization.directory.sync` permission. Enqueues a deduplicated background job (at most one active job per provider) and audits the request with the caller as actor; the worker performs the synchronization. Requests must be same-origin. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      responses:
        '202':
          description: "The job was enqueued (`created: true`) or an active job already exists (`created: false`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorySyncRequest'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Directory synchronization is not configured on this API instance (organization.directory_sync_not_configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-sync-runs/{id}:
    get:
      operationId: getDirectorySyncRun
      summary: Get a directory synchronization run.
      description: "Requires authentication and both `organization.directory.view` and `organization.view`. Responses are `Cache-Control: no-store`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The requested run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorySyncRun'
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Return the current authentication session.
      description: "Requires a valid `turaco_session` cookie. Responses are `Cache-Control: no-store`. `permissions` are the effective permissions from the user's role assignments (directly and through Directory Groups)."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      description: "Revokes the session in the `turaco_session` cookie and clears the cookie. Idempotent: without a valid session the cookie is still cleared and 204 is returned. Requests must be same-origin (`Sec-Fetch-Site` / `Origin`); otherwise 403 `platform.csrf_rejected`."
      responses:
        '204':
          description: Logged out; the session cookie is cleared.
        '403':
          description: Cross-origin request rejected (platform.csrf_rejected).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/methods:
    get:
      operationId: getAuthMethods
      summary: Report which login methods are configured.
      description: "Unauthenticated. The UI uses it to offer only configured methods. Responses are `Cache-Control: no-store`."
      responses:
        '200':
          description: Configured login methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethods'
  /auth/login:
    post:
      operationId: login
      summary: Log in with a directory username or email and password.
      description: "Verifies the password by binding to the directory as the synced account (LDAPS/StartTLS). On success a new session cookie is set and any session carried by the request is revoked. Every credential failure answers the same 401 after a minimum response time. Requests must be same-origin. See docs/security/identity-access-design.md §6."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Logged in; the session cookie is set.
        '400':
          description: Malformed request (auth.invalid_request), e.g. empty identifier or password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Invalid credentials (auth.invalid_credentials). Unknown, disabled and wrong-password accounts are indistinguishable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Cross-origin request rejected (platform.csrf_rejected).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Password login is not configured (auth.method_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Too many attempts for this account or client (auth.too_many_attempts); attempts are counted before verification, so concurrent attempts count too. See Retry-After.
          headers:
            Retry-After:
              schema: {type: integer}
              description: Seconds until the lock expires.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: The directory cannot be reached (auth.provider_unavailable), or the account is being changed concurrently and sign-in timed out (auth.temporarily_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/emergency-login:
    post:
      operationId: emergencyLogin
      summary: Log in with the local emergency (break-glass) account.
      description: "Exists only when AUTH_EMERGENCY_LOGIN_ENABLED=true; otherwise 404 auth.method_unavailable. Same throttling and generic errors as /auth/login. Sessions are capped at one hour. Every use is audited and logged at error level."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyLoginRequest'
      responses:
        '204':
          description: Logged in; the session cookie is set.
        '400':
          description: Malformed request (auth.invalid_request).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Invalid credentials (auth.invalid_credentials).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Cross-origin request rejected (platform.csrf_rejected).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Emergency login is disabled (auth.method_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Too many attempts from this client, or password verification is busy (auth.too_many_attempts); see Retry-After (short when busy).
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
  /auth/kerberos:
    get:
      operationId: kerberosLogin
      summary: Log in with Kerberos/SPNEGO (Windows integrated authentication).
      description: "404 auth.method_unavailable when Kerberos is not configured. Without an `Authorization: Negotiate <token>` header, or with an NTLM token, the response is 401 with `WWW-Authenticate: Negotiate` (not throttled or audited). With a token, the client attempt is reserved, the ticket is validated with the service keytab (realm, single-component principal, clock skew, replay cache) and the principal's username is mapped to a synced, enabled directory account of an active User whose username matches exactly or ASCII-case-insensitively; then a session cookie is set (204) and any session carried by the request is replaced. Cross-site requests (`Sec-Fetch-Site` other than same-origin/none, or an `Origin` host different from the request host) are rejected with 403 because this GET creates a session. Failures are uniform 401s after the same minimum time as password login and are audited without ticket contents."
      responses:
        '204':
          description: Logged in; the session cookie is set.
        '400':
          description: Several or oversized (over 64 KiB) Authorization headers (auth.invalid_request).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Negotiation required, or the ticket or account was rejected (auth.invalid_credentials).
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: "`Negotiate` on every 401 of this endpoint."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Cross-site request rejected (platform.csrf_rejected).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Kerberos is not configured (auth.method_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Too many attempts from this client (auth.too_many_attempts); see Retry-After.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Sign-in timed out waiting for a concurrent account change (auth.temporarily_unavailable).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
  /permissions:
    get:
      operationId: listPermissions
      summary: List all registered permissions.
      description: "Requires `platform.roles.view`."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: All permissions, sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /roles:
    get:
      operationId: listRoles
      summary: List roles.
      description: "Requires `platform.roles.view`. Not paginated (roles are few); sorted by name."
      security:
        - sessionAuth: []
      responses:
        '200':
          description: All roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createRole
      summary: Create a custom role.
      description: "Requires `platform.roles.manage`. Audited (authorization.role.created)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: The created role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /roles/{id}:
    get:
      operationId: getRole
      summary: Get a role.
      description: "Requires `platform.roles.view`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateRole
      summary: Rename or redescribe a custom role.
      description: "Requires `platform.roles.manage`. The built-in role cannot be changed (409 authorization.built_in_role). Audited (authorization.role.updated)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleUpdate'}
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteRole
      summary: Delete a custom role without active assignments.
      description: "Requires `platform.roles.manage`. 409 authorization.role_in_use while active assignments exist, 409 authorization.built_in_role for the built-in role. Audited (authorization.role.deleted)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /roles/{id}/permissions:
    put:
      operationId: setRolePermissions
      summary: Replace the permissions of a custom role.
      description: "Requires `platform.roles.manage`. Every name must be registered (400 authorization.unknown_permission). Audited (authorization.role.permissions_changed) with before/after."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RolePermissionsUpdate'}
      responses:
        '200':
          description: The updated role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /role-assignments:
    get:
      operationId: listRoleAssignments
      summary: List role assignments.
      description: "Requires `platform.roles.view`. Newest first (descending id). Active only unless includeRevoked=true."
      security:
        - sessionAuth: []
      parameters:
        - {name: roleId, in: query, schema: {type: string}}
        - {name: subjectType, in: query, schema: {type: string, enum: [user, directory_group]}}
        - {name: subjectId, in: query, schema: {type: string}}
        - {name: includeRevoked, in: query, schema: {type: boolean}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of assignments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAssignmentList'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: assignRole
      summary: Assign a role to a User or Directory Group (global scope).
      description: "Requires `platform.roles.manage`. The subject must exist (Directory Group not deleted); 409 authorization.duplicate_assignment for an existing active assignment. Audited (authorization.role.assigned)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleAssignmentCreate'}
      responses:
        '201':
          description: The created assignment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAssignment'}
        '400': {$ref: '#/components/responses/AuthorizationInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /role-assignments/{id}/revoke:
    post:
      operationId: revokeRoleAssignment
      summary: Revoke a role assignment.
      description: "Requires `platform.roles.manage`. Idempotent for already revoked assignments (200, no new audit). Revoking the last active platform-administrator assignment of a User is refused (409 authorization.last_administrator). Audited (authorization.role.assignment_revoked)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The revoked assignment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoleAssignment'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AuthorizationNotFound'}
        '409': {$ref: '#/components/responses/AuthorizationConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: Query the audit log.
      description: "Requires `platform.audit.view`. Newest first by occurredAt, then id. `cursor` is opaque (pass `nextCursor` back unchanged). `action` is exact; `actionPrefix` is a literal, valid UTF-8 prefix (e.g. `authorization.`); `targetId` requires `targetType`; time bounds are RFC 3339 and half-open [from, to). Combine broad prefixes with a time range for speed. Invalid filters yield 400 audit.invalid_filter."
      security:
        - sessionAuth: []
      parameters:
        - {name: targetType, in: query, schema: {type: string, maxLength: 100}}
        - {name: targetId, in: query, schema: {type: string, maxLength: 200}}
        - {name: action, in: query, schema: {type: string, maxLength: 200}}
        - {name: actionPrefix, in: query, schema: {type: string, maxLength: 200}}
        - {name: actorId, in: query, schema: {type: string}}
        - {name: correlationId, in: query, schema: {type: string, maxLength: 200}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of audit events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventList'}
        '400':
          description: Invalid filter or paging (audit.invalid_filter, audit.invalid_cursor, audit.invalid_limit).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: turaco_session
      description: Opaque server-side session token in an HttpOnly, SameSite=Lax cookie. The token is accepted from the cookie only.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size, default 50; values above 200 are clamped to 200. Non-numeric or below 1 yields 400 `<module>.invalid_limit` (e.g. organization.invalid_limit, authorization.invalid_limit, audit.invalid_limit).
      schema: {type: integer, minimum: 1}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's nextCursor; pass it back unchanged. Invalid values yield 400 `<module>.invalid_cursor`.
      schema: {type: string}
    Query:
      name: q
      in: query
      description: Case-insensitive name prefix, at most 100 characters (else 400 organization.invalid_query).
      schema: {type: string, maxLength: 100}
    UserStatus:
      name: status
      in: query
      description: Exact status filter (else 400 organization.invalid_status).
      schema: {type: string, enum: [active, inactive, departed, external, unknown]}
    ProviderKey:
      name: providerKey
      in: query
      description: Exact directory provider key filter, at most 100 characters (else 400 organization.invalid_provider_key).
      schema: {type: string, maxLength: 100}
  responses:
    InvalidRequest:
      description: Invalid limit, cursor, query, status or provider key (organization.invalid_limit, organization.invalid_cursor, organization.invalid_query, organization.invalid_status, organization.invalid_provider_key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Authentication is required (platform.unauthenticated).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing permission (platform.forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (organization.not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal error (platform.internal_error); the message never contains internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrganizationInvalid:
      description: Invalid input (organization.invalid_request, organization.invalid_cursor, organization.invalid_limit, organization.invalid_query, organization.invalid_status).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrganizationConflict:
      description: Conflict (organization.conflict, organization.user_not_active, organization.team_inactive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BriefingInvalid:
      description: Invalid input (briefing.invalid_request, briefing.invalid_cursor, briefing.invalid_limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BriefingNotFound:
      description: Item not found or not visible to the caller (briefing.not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BriefingConflict:
      description: Conflict (briefing.invalid_transition, briefing.version_conflict).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProductsInvalid:
      description: Invalid input (products.invalid_request, products.invalid_reference, products.invalid_cursor, products.invalid_limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProductsNotFound:
      description: Not found (products.not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProductsConflict:
      description: Conflict (products.conflict, products.version_conflict).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TasksInvalid:
      description: Invalid input (tasks.invalid_request, tasks.assignee_invalid, tasks.invalid_cursor, tasks.invalid_limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TasksNotFound:
      description: Task not found or not visible to the caller (tasks.not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TasksConflict:
      description: Conflict (tasks.invalid_transition, tasks.version_conflict).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthorizationInvalid:
      description: Invalid input (authorization.invalid_request, authorization.unknown_permission, authorization.invalid_cursor, authorization.invalid_limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthorizationNotFound:
      description: Role, assignment or subject not found (authorization.not_found, authorization.subject_not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthorizationConflict:
      description: Conflict (authorization.duplicate_key, authorization.built_in_role, authorization.role_in_use, authorization.duplicate_assignment, authorization.last_administrator).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AuthSession:
      type: object
      additionalProperties: false
      required: [userId, authMethod, expiresAt, permissions]
      properties:
        userId: {type: string}
        authMethod: {type: string, description: "ldap, kerberos or emergency."}
        expiresAt:
          type: string
          format: date-time
          description: Earlier of the idle and absolute expiry.
        permissions:
          type: array
          items: {type: string}
          description: Sorted effective permission names.
    Meta:
      type: object
      additionalProperties: false
      required: [name, version, environment]
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, displayName, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        givenName:
          type: [string, "null"]
        familyName:
          type: [string, "null"]
        primaryEmail:
          type: [string, "null"]
        status:
          type: string
          enum: [active, inactive, departed, external, unknown]
        departmentId:
          type: [string, "null"]
          format: uuid
        primaryLocationId:
          type: [string, "null"]
          format: uuid
        managerUserId:
          type: [string, "null"]
          format: uuid
        updatedAt:
          type: string
          format: date-time
    Team:
      type: object
      additionalProperties: false
      required: [id, name, active, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    Task:
      type: object
      additionalProperties: false
      required: [id, title, description, status, statusReason, priority, assignedUserId, assignedUserName, assignedTeamId, assignedTeamName, contextType, contextId, dueAt, completedAt, createdByUserId, completedByUserId, recurrenceDefinitionId, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: [string, "null"]}
        status: {type: string, enum: [open, in_progress, blocked, completed, cancelled]}
        statusReason: {type: [string, "null"], description: "Set exactly while the task is blocked or cancelled."}
        priority: {type: string, enum: [low, normal, high, urgent]}
        assignedUserId: {type: [string, "null"], format: uuid}
        assignedUserName: {type: [string, "null"]}
        assignedTeamId: {type: [string, "null"], format: uuid}
        assignedTeamName: {type: [string, "null"]}
        contextType: {type: [string, "null"]}
        contextId: {type: [string, "null"], format: uuid}
        dueAt: {type: [string, "null"], format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
        createdByUserId: {type: [string, "null"], format: uuid}
        completedByUserId: {type: [string, "null"], format: uuid}
        recurrenceDefinitionId: {type: [string, "null"], format: uuid, description: "Set on tasks generated from a recurring task definition (which may have been deleted since)."}
        version: {type: integer, minimum: 1, description: "Increases with every change; send it as expectedVersion for optimistic concurrency."}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TaskList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Task'}
        nextCursor: {type: string}
    RecurrenceRule:
      type: object
      additionalProperties: false
      required: [frequency, interval, weekday, dayOfMonth, timeOfDay, timezone, startsOn]
      properties:
        frequency: {type: string, enum: [daily, weekly, monthly]}
        interval: {type: integer, minimum: 1, maximum: 365, description: "Every N days, weeks or months, anchored at startsOn."}
        weekday: {type: [integer, "null"], minimum: 1, maximum: 7, description: "Weekly only; 1 = Monday, 7 = Sunday."}
        dayOfMonth: {type: [integer, "null"], minimum: 1, maximum: 31, description: "Monthly only; clamped to the last day of shorter months."}
        timeOfDay: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: "Local time HH:MM."}
        timezone: {type: string, description: "IANA time zone name such as Europe/Berlin."}
        startsOn: {type: string, format: date, description: "Local date of the first possible run."}
    RecurringTaskDefinition:
      type: object
      additionalProperties: false
      required: [id, title, description, priority, assignedUserId, assignedTeamId, dueAfterHours, rule, active, nextRunAt, lastGeneratedAt, createdByUserId, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: [string, "null"]}
        priority: {type: string, enum: [low, normal, high, urgent]}
        assignedUserId: {type: [string, "null"], format: uuid}
        assignedTeamId: {type: [string, "null"], format: uuid}
        dueAfterHours: {type: [integer, "null"], minimum: 1, maximum: 8760, description: "Generated tasks are due this many hours after their scheduled run."}
        rule: {$ref: '#/components/schemas/RecurrenceRule'}
        active: {type: boolean}
        nextRunAt: {type: [string, "null"], format: date-time, description: "Null exactly while paused."}
        lastGeneratedAt: {type: [string, "null"], format: date-time}
        createdByUserId: {type: [string, "null"], format: uuid}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RecurringTaskDefinitionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RecurringTaskDefinition'}
        nextCursor: {type: string}
    RecurringTaskDefinitionCreate:
      type: object
      additionalProperties: false
      required: [title, rule]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 10000}
        priority: {type: string, enum: [low, normal, high, urgent], default: normal}
        assignedUserId: {type: [string, "null"], format: uuid}
        assignedTeamId: {type: [string, "null"], format: uuid}
        dueAfterHours: {type: [integer, "null"], minimum: 1, maximum: 8760}
        rule: {$ref: '#/components/schemas/RecurrenceRule'}
    RecurringTaskDefinitionUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 10000, description: "Empty clears."}
        priority: {type: string, enum: [low, normal, high, urgent]}
        assignedUserId: {type: string, format: uuid}
        assignedTeamId: {type: string, format: uuid}
        clearAssignment: {type: boolean, description: "Removes both assignees; excludes assignedUserId/assignedTeamId."}
        dueAfterHours: {type: integer, minimum: 1, maximum: 8760}
        clearDueAfter: {type: boolean}
        rule: {$ref: '#/components/schemas/RecurrenceRule'}
    BriefingItem:
      type: object
      additionalProperties: false
      required: [id, title, body, severity, status, validUntil, authorUserId, publishedAt, publishedByUserId, withdrawnAt, withdrawnByUserId, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string, description: "Plain text; clients must not render it as HTML."}
        severity: {type: string, enum: [info, warning, critical]}
        status: {type: string, enum: [draft, published, withdrawn]}
        validUntil: {type: [string, "null"], format: date-time, description: "After this instant a published item is hidden from viewers."}
        authorUserId: {type: [string, "null"], format: uuid}
        publishedAt: {type: [string, "null"], format: date-time}
        publishedByUserId: {type: [string, "null"], format: uuid}
        withdrawnAt: {type: [string, "null"], format: date-time}
        withdrawnByUserId: {type: [string, "null"], format: uuid}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    BriefingItemList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BriefingItem'}
        nextCursor: {type: string}
    BriefingItemCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, maxLength: 10000}
        severity: {type: string, enum: [info, warning, critical], default: info}
        validUntil: {type: [string, "null"], format: date-time}
    BriefingItemUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, maxLength: 10000}
        severity: {type: string, enum: [info, warning, critical]}
        validUntil: {type: string, format: date-time}
        clearValidUntil: {type: boolean}
    Manufacturer:
      type: object
      additionalProperties: false
      required: [id, name, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ManufacturerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Manufacturer'}
        nextCursor: {type: string}
    ManufacturerRename:
      type: object
      additionalProperties: false
      required: [name, expectedVersion]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        expectedVersion: {type: integer, minimum: 1}
    ProductCategory:
      type: object
      additionalProperties: false
      required: [id, name, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        parentId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProductCategoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProductCategory'}
        nextCursor: {type: string}
    ProductCategoryRename:
      type: object
      additionalProperties: false
      required: [name, expectedVersion]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        expectedVersion: {type: integer, minimum: 1}
    ManufacturerCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    ProductCategoryCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        parentId: {type: [string, "null"], format: uuid}
    Product:
      type: object
      additionalProperties: false
      required: [id, name, manufacturerId, categoryId, manufacturerPartNumber, internalPartNumber, serialized, stockManaged, assetManaged, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        manufacturerId: {type: [string, "null"], format: uuid}
        categoryId: {type: [string, "null"], format: uuid}
        manufacturerPartNumber: {type: [string, "null"]}
        internalPartNumber: {type: [string, "null"]}
        serialized: {type: boolean}
        stockManaged: {type: boolean}
        assetManaged: {type: boolean}
        active: {type: boolean}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProductList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Product'}
        nextCursor: {type: string}
    ProductCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        manufacturerId: {type: [string, "null"], format: uuid}
        categoryId: {type: [string, "null"], format: uuid}
        manufacturerPartNumber: {type: string, maxLength: 100}
        internalPartNumber: {type: string, maxLength: 100}
        serialized: {type: boolean, default: false}
        stockManaged: {type: boolean, default: true}
        assetManaged: {type: boolean, default: false}
    ProductUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 200}
        manufacturerId: {type: string, format: uuid}
        clearManufacturer: {type: boolean}
        categoryId: {type: string, format: uuid}
        clearCategory: {type: boolean}
        manufacturerPartNumber: {type: string, maxLength: 100, description: "Empty clears."}
        internalPartNumber: {type: string, maxLength: 100, description: "Empty clears."}
        serialized: {type: boolean}
        stockManaged: {type: boolean}
        assetManaged: {type: boolean}
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 10000}
        priority: {type: string, enum: [low, normal, high, urgent], default: normal}
        dueAt: {type: [string, "null"], format: date-time}
        assignedUserId: {type: [string, "null"], format: uuid}
        assignedTeamId: {type: [string, "null"], format: uuid}
    TaskUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 10000, description: "Empty clears."}
        priority: {type: string, enum: [low, normal, high, urgent]}
        dueAt: {type: [string, "null"], format: date-time, description: "null clears; absent keeps."}
    TaskAssign:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: {type: integer, minimum: 1}
        userId: {type: [string, "null"], format: uuid}
        teamId: {type: [string, "null"], format: uuid}
    TaskVersion:
      type: object
      additionalProperties: false
      properties:
        expectedVersion: {type: integer, minimum: 1}
    TaskTransition:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500}
    Notification:
      type: object
      additionalProperties: false
      required: [id, category, params, linkType, linkId, createdAt, readAt]
      properties:
        id: {type: string, format: uuid}
        category: {type: string, description: "For example task.assigned or task.completed; unknown categories must get a generic text."}
        params: {type: object, additionalProperties: true}
        linkType: {type: [string, "null"], description: "For example task."}
        linkId: {type: [string, "null"], format: uuid}
        createdAt: {type: string, format: date-time}
        readAt: {type: [string, "null"], format: date-time}
    NotificationPreference:
      type: object
      additionalProperties: false
      required: [category, channel, enabled]
      properties:
        category: {type: string}
        channel: {type: string, enum: [email]}
        enabled: {type: boolean}
    NotificationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        nextCursor: {type: string}
    TeamName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    TeamMemberAdd:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: {type: string, format: uuid}
        role: {type: [string, "null"], maxLength: 100}
    TeamMember:
      type: object
      additionalProperties: false
      required: [userId, displayName, source, validFrom]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: [string, "null"]
        source:
          type: string
        validFrom:
          type: string
          format: date-time
    Location:
      type: object
      additionalProperties: false
      required: [id, name, active, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        externalKey:
          type: [string, "null"]
        active:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    DirectoryGroup:
      type: object
      additionalProperties: false
      required: [id, providerKey, externalId, displayName, firstObservedAt, lastObservedAt]
      properties:
        id:
          type: string
          format: uuid
        providerKey:
          type: string
        externalId:
          type: string
        displayName:
          type: string
        description:
          type: [string, "null"]
        firstObservedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        deletedObservedAt:
          type: [string, "null"]
          format: date-time
    DirectoryGroupMember:
      type: object
      additionalProperties: false
      required: [userId, displayName, observedFrom, lastObservedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        observedFrom:
          type: string
          format: date-time
          description: Start of the current continuous observed interval.
        lastObservedAt:
          type: string
          format: date-time
    UserDetail:
      type: object
      additionalProperties: false
      required: [id, displayName, status, updatedAt, externalIdentities]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        givenName:
          type: [string, "null"]
        familyName:
          type: [string, "null"]
        primaryEmail:
          type: [string, "null"]
        status:
          type: string
          enum: [active, inactive, departed, external, unknown]
        departmentId:
          type: [string, "null"]
          format: uuid
        primaryLocationId:
          type: [string, "null"]
          format: uuid
        managerUserId:
          type: [string, "null"]
          format: uuid
        updatedAt:
          type: string
          format: date-time
        externalIdentities:
          type: array
          description: Directory accounts linked to the user, ordered by provider key. Not included in user lists.
          items:
            $ref: '#/components/schemas/ExternalIdentity'
    ExternalIdentity:
      type: object
      additionalProperties: false
      required: [providerKey, username, enabled, lastSeenAt, deletedObservedAt]
      properties:
        providerKey:
          type: string
        username:
          type: [string, "null"]
        enabled:
          type: boolean
          description: Whether the directory account is enabled as last observed.
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        deletedObservedAt:
          type: [string, "null"]
          format: date-time
          description: Set when the account was no longer observed in the directory; cleared when it reappears.
    SyncConflict:
      type: object
      additionalProperties: false
      required: [kind, externalId, username]
      properties:
        kind:
          type: string
          enum: [email_in_use, manager_unresolved, invalid_attributes]
        externalId:
          type: string
        username:
          type: string
    DirectorySyncRun:
      type: object
      additionalProperties: false
      required: [id, providerKey, jobId, trigger, startedAt, observedAt, finishedAt, outcome, counts, conflicts, conflictCount, error]
      properties:
        id:
          type: string
          format: uuid
        providerKey:
          type: string
        jobId:
          type: [string, "null"]
          format: uuid
          description: The platform job that executed the run; null when the run was not started by a job.
        trigger:
          type: string
          enum: [scheduled, manual]
        startedAt:
          type: string
          format: date-time
        observedAt:
          type: [string, "null"]
          format: date-time
          description: The time the directory snapshot was observed; null while running or when the fetch failed.
        finishedAt:
          type: [string, "null"]
          format: date-time
        outcome:
          type: string
          enum: [running, succeeded, failed, sweep_withheld]
          description: '`sweep_withheld` is a successful run in which the not-observed sweep of users and/or groups was withheld by the safeguard (too many objects missing from the snapshot); everything else in the snapshot was applied.'
        counts:
          type: object
          description: Counters of a run that applied a snapshot (usersObserved, usersCreated, usersUpdated, usersUnchanged, usersNotObserved, usersSweepWithheld, usersActivated, usersDeactivated, sessionsRevoked, groupsObserved, groupsCreated, groupsUpdated, groupsNotObserved, groupsSweepWithheld, membershipsOpened, membershipsClosed, nestingOpened, nestingClosed, unresolvedMembers). Empty for other outcomes.
          additionalProperties: {type: integer}
        conflicts:
          type: array
          description: At most 100 conflicts; `conflictCount` is the total.
          items:
            $ref: '#/components/schemas/SyncConflict'
        conflictCount:
          type: integer
        error:
          type: [string, "null"]
          description: Sanitized failure reason, at most 500 characters; never contains attribute values.
    DirectorySyncRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DirectorySyncRun'
        nextCursor:
          type: string
          description: Opaque cursor for the next page; omitted on the last page.
    DirectorySyncRequest:
      type: object
      additionalProperties: false
      required: [jobId, created]
      properties:
        jobId:
          type: string
