    patch:
      operationId: updateAsset
      summary: Change descriptive fields.
      description: "Needs `assets.manage`. `expectedVersion` is required. Not for disposed assets. Notes are not copied into the audit log."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
