      description: "Requires `catalog.manage`. The definition is validated against the closed schema of ADR-0025 (field types, limits, references to users, teams, products and categories must exist and be active). Audited (catalog.item.created, without title or definition)."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogItem'}
        '400': {$ref: '#/components/responses/CatalogInvalid'}
        '409': {$ref: '#/components/responses/CatalogConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /catalog-items/{id}:
    get:
      operationId: getCatalogItem
      summary: Get a catalog item with its form.
      description: "Any signed-in user gets the form of an active item (fields, with the active products of product fields resolved to `productOptions`); approval steps and fulfillment tasks are never shown to employees. `catalog.manage` also gets inactive items and the full `definition`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogForm'}
        '404': {$ref: '#/components/responses/CatalogNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateCatalogItem
      summary: Change a catalog item.
      description: "Requires `catalog.manage`. Changing the definition affects only requests submitted afterwards. `expectedVersion` is required. Audited (catalog.item.updated; changed parts only)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemUpdate'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogItem'}
        '400': {$ref: '#/components/responses/CatalogInvalid'}
        '404': {$ref: '#/components/responses/CatalogNotFound'}
        '409': {$ref: '#/components/responses/CatalogConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /catalog-items/{id}/activate:
    post:
      operationId: activateCatalogItem
      summary: Activate a catalog item.
      description: "Requires `catalog.manage`. Inactive items are not offered; existing requests keep their snapshot. Idempotent. Audited (catalog.item.activated)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskVersion'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogItem'}
        '404': {$ref: '#/components/responses/CatalogNotFound'}
        '409': {$ref: '#/components/responses/CatalogConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /catalog-items/{id}/deactivate:
    post:
      operationId: deactivateCatalogItem
      summary: Deactivate a catalog item.
      description: "Requires `catalog.manage`. Inactive items are not offered; existing requests keep their snapshot. Idempotent. Audited (catalog.item.deactivated)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskVersion'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogItem'}
        '404': {$ref: '#/components/responses/CatalogNotFound'}
        '409': {$ref: '#/components/responses/CatalogConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /service-requests:
    post:
      operationId: submitServiceRequest
      summary: Submit a service request.
      description: "Any signed-in User. The answers are validated against the catalog item's definition; the definition and the answers are snapshotted. With approval steps the request starts as `pending_approval` and the first approver is notified; without them it enters fulfillment at once (its fulfillment tasks are created; with none it completes immediately). The requester and the requested-for User can never approve it. Audited (requests.request.submitted, without answers); emits ServiceRequestSubmitted."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestSubmit'
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceRequest'}
        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '409': {$ref: '#/components/responses/RequestsConflict'}
        '422':
          description: Some answers are invalid (requests.invalid_answers); `error.fields` maps each field key to a code (required, invalid_type, too_long, out_of_range, invalid_choice, unknown_field, not_found, invalid_date, invalid_characters, not_allowed, not_active).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listServiceRequests
      summary: List service requests.
      description: "Any signed-in User. Default `scope=mine`: requests the caller made or that are for the caller, newest first. `scope=all` needs `requests.view` or `requests.manage`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: scope
          in: query
          schema: {type: string, enum: [mine, all]}
        - name: status
          in: query
          schema: {type: string, enum: [pending_approval, in_fulfillment, waiting, completed, rejected, cancelled]}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceRequestList'}
        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /service-requests/{id}:
    get:
      operationId: getServiceRequest
      summary: Get a service request.
      description: "Any signed-in User. Visible to the requester, the requested-for User, approvers of its steps and holders of `requests.view`/`requests.manage`; everybody else gets 404. Includes the answers with the form labels, approvals, fulfillment tasks, resolved names and the `actions` the caller may perform now. Approval and fulfillment definitions of the snapshot are not exposed."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceRequestDetail'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /service-requests/{id}/cancel:
    post:
      operationId: cancelServiceRequest
      summary: Cancel a request.
      description: "The requester may cancel while approval is pending; `requests.manage` may cancel any unfinished request. A reason is required. Pending approvals and unfinished tasks are cancelled with it. Audited (requests.request.cancelled); emits ServiceRequestCancelled."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestReason'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceRequest'}
        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '409': {$ref: '#/components/responses/RequestsConflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /service-requests/{id}/hold:
    post:
      operationId: holdServiceRequest
      summary: Put a request on hold.
      description: "Requires `requests.manage`. `reason` is the waiting reason: stock, supplier, requester or external_system. In fulfillment only. Audited (requests.request.put_on_hold)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestReason'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceRequest'}
        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '409': {$ref: '#/components/responses/RequestsConflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /service-requests/{id}/resume:
    post:
      operationId: resumeServiceRequest
      summary: Resume a request.
      description: "Requires `requests.manage`. Only a waiting request; it completes at once when its tasks finished meanwhile. Audited (requests.request.resumed)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskVersion'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceRequest'}
        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '409': {$ref: '#/components/responses/RequestsConflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /service-requests/{id}/complete:
    post:
      operationId: completeServiceRequest
      summary: Complete a request manually.
      description: "Requires `requests.manage`. Every fulfillment task must be finished; when a mandatory task was cancelled, a `reason` is required. Audited (requests.request.completed); emits ServiceRequestCompleted."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestReason'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceRequest'}
        '400': {$ref: '#/components/responses/RequestsInvalid'}
        '404': {$ref: '#/components/responses/RequestsNotFound'}
        '409': {$ref: '#/components/responses/RequestsConflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /assets:
    get:
      operationId: listAssets
      summary: List assets.
      description: "Needs `assets.view` or `assets.manage`. Filters combine; `q` matches the reference, serial number or asset tag by prefix. Keyset paginated."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: {type: string, enum: [received, available, reserved, assigned, returned, in_repair, retired, disposed, lost]}
        - name: productId
          in: query
          schema: {type: string, format: uuid}
        - name: assigneeId
          in: query
          description: Active assignment to this User, Team or Location
          schema: {type: string, format: uuid}
        - name: locationId
          in: query
          schema: {type: string, format: uuid}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetList'}
        '400': {$ref: '#/components/responses/AssetsInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createAsset
      summary: Register an asset.
      description: "Needs `assets.manage`. Registers existing equipment (status `available`, or `received` to still check it). The product must be active and asset-managed; serialized products need a serial number. Audited (assets.asset.created); emits AssetCreated."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
      responses:
        '201':
          description: The created asset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        '400': {$ref: '#/components/responses/AssetsInvalid'}
        '409': {$ref: '#/components/responses/AssetsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /assets/lookup:
    get:
      operationId: lookupAsset
      summary: Find an asset by a scanned code.
      description: "Needs `assets.view` or `assets.manage`. Matches the asset tag, serial number or reference exactly (case-insensitive). 409 assets.conflict when a serial number is shared by several products."
      security:
        - sessionAuth: []
      parameters:
        - name: code
          in: query
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: The asset.
          content:
            application/json:
