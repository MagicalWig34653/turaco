            application/json:
              schema: {$ref: '#/components/schemas/ManagementArtifactDetail'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /management-artifacts/{id}/history:
    get:
      operationId: getManagementArtifactHistory
      summary: List meaningful management artifact changes, newest first.
      description: "Needs `endpoint.management.view` or `endpoints.manage`. Assignment added, changed and removed entries and artifact removal are keyset paged. Group names and IDs are redacted without `organization.directory.view`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
