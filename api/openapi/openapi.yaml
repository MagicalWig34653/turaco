        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /management-artifacts:
    get:
      operationId: listManagementArtifacts
      summary: List provider management artifacts.
      description: "Needs `endpoint.management.view` or `endpoints.manage`. The search is a name prefix of at most 100 characters."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
