            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/start:
    post:
      operationId: startDeployment
      summary: Start a scheduled Deployment.
      description: "Moves a `scheduled` Deployment through `resolving_targets` to `running`; the first ring is activated by the engine. Needs `deployments.execute` and `expectedVersion` (the Deployment's version). Refused with 409 endpoints.deploy_write_disabled while the deploy-write capability is off, 403 endpoints.separation_of_duties when the planner of a high-impact plan tries to start it, 403 endpoints.high_impact_required, 409 endpoints.plan_changed and the gates (endpoints.version_not_approved, endpoints.product_not_approved, endpoints.change_window_closed, endpoints.soak_not_elapsed, endpoints.threshold_not_met, endpoints.evidence_not_fresh, endpoints.promotion_approval_required). Audited."
