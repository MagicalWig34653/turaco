  /deployments/{id}/resume:
    post:
      operationId: resumeDeployment
      summary: Resume a paused Deployment.
      description: "Allowed only while the paused reason can be lifted (a revoked version or blocked product keeps it paused). Needs `deployments.execute` and `expectedVersion` (the Deployment's version). Refused with 409 endpoints.deploy_write_disabled while the deploy-write capability is off, 403 endpoints.separation_of_duties when the planner of a high-impact plan tries to start it, 403 endpoints.high_impact_required, 409 endpoints.plan_changed and the gates (endpoints.version_not_approved, endpoints.product_not_approved, endpoints.change_window_closed, endpoints.soak_not_elapsed, endpoints.threshold_not_met, endpoints.evidence_not_fresh, endpoints.promotion_approval_required). Audited."
