      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [open, in_progress, blocked, completed, cancelled]}
        dueAt: {type: string, format: date-time, nullable: true}
        assignedUserId: {type: string, format: uuid}
        assignedTeamId: {type: string, format: uuid}
        assigneeName: {type: string}
        assigneeHidden: {type: boolean}
    SecurityRemediationTaskList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecurityRemediationTask'}}
    SecurityCreateTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, dueAt]
      description: A fixed title based on the parent reference is generated by Turaco. Exactly one assignee is required.
      oneOf:
      - required: [assignedUserId]
      - required: [assignedTeamId]
      properties:
        expectedVersion: {type: integer, minimum: 1, description: Current version of the parent Advisory or Finding.}
        assignedUserId: {type: string, format: uuid}
        assignedTeamId: {type: string, format: uuid}
        dueAt: {type: string, format: date-time}
    SecurityTaskCreated:
      type: object
      required: [taskId]
      properties:
        taskId: {type: string, format: uuid}
    SecurityChangeLink:
      type: object
      required: [id, hidden]
      description: Hidden Changes appear as placeholders; changeId, reference and status are omitted.
      properties:
        id: {type: string, format: uuid}
        hidden: {type: boolean}
        changeId: {type: string, format: uuid}
        reference: {type: string}
        status: {type: string}
    SecurityChangeLinkList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SecurityChangeLink'}}
    SecurityLinkChangeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, changeId]
      properties:
        expectedVersion: {type: integer, minimum: 1, description: Current Advisory version.}
        changeId: {type: string, format: uuid}
    SecurityProgress:
      type: object
      required: [generatedAt, tasksTruncated, source, findingByStatus, findingByConfidence, shareRemediated, acceptedRiskCount, earliestRiskReviewBy, oldestOpenFindingAgeDays, tasks, linkedChangesByStatus, hiddenLinkedChanges, residualRisk]
      properties:
        generatedAt: {type: string, format: date-time, description: RFC3339 timestamp when the Security snapshot was generated.}
        tasksTruncated: {type: boolean, description: True when Finding Task counts cover only the first 20,000 Finding IDs.}
        source: {type: string, enum: [turaco_derived]}
        findingByStatus: {type: object, additionalProperties: {type: integer}}
        findingByConfidence: {type: object, additionalProperties: {type: integer}}
        shareRemediated: {type: number, format: double, minimum: 0, maximum: 1, description: Remediated findings divided by all findings excluding false positives.}
        acceptedRiskCount: {type: integer}
        earliestRiskReviewBy: {type: string, format: date-time, nullable: true}
        oldestOpenFindingAgeDays: {type: integer, nullable: true}
        tasks:
          type: object
          required: [open, done, cancelled, overdue]
          properties:
            open: {type: integer}
            done: {type: integer, description: Completed Tasks only.}
            cancelled: {type: integer}
            overdue: {type: integer}
        linkedChangesByStatus: {type: object, additionalProperties: {type: integer}}
        hiddenLinkedChanges: {type: integer}
        residualRisk: {type: string, enum: [none, low, medium, high, unknown], description: Unknown when the Advisory is outside the applicable family, matching is missing/incomplete/truncated or matched inventory ingestion is over 48 hours old. Otherwise derived from severity and live probable/potential findings including accepted risk.}
    SecurityOverview:
      type: object
      required: [source, applicableBySeverity, openFindingsByConfidence, knownExploitedApplicable, overdueTasks, riskAcceptancesDueWithin30Days]
      properties:
        source: {type: string, enum: [turaco_derived]}
        applicableBySeverity: {type: object, additionalProperties: {type: integer}}
        openFindingsByConfidence: {type: object, additionalProperties: {type: integer}}
        knownExploitedApplicable: {type: integer, description: Live advisories listed in the CISA Known Exploited Vulnerabilities catalog.}
        overdueTasks: {type: integer}
        riskAcceptancesDueWithin30Days: {type: integer}
    SecurityAdvisory:
      type: object
      required: [id, reference, source, externalId, title, summary, severity, status, criteriaRevision, matchedRevision, matchTruncated, unmatchedCriteria, criteriaIncomplete, criteriaSkipped, criteriaChangedUpstream, knownExploited, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        source: {type: string}
        knownExploited: {type: boolean, description: Listed in the CISA Known Exploited Vulnerabilities catalog. Set only by the feed sync, never by manual edit.}
        knownExploitedAddedAt: {type: string, format: date, nullable: true}
        kevDueDate: {type: string, format: date, nullable: true, description: Remediation due date of the KEV catalog.}
        externalId: {type: string, nullable: true}
        title: {type: string}
        summary: {type: string, nullable: true}
        severity: {type: string, enum: [none, low, medium, high, critical]}
        sourceUrl: {type: string, nullable: true}
        publishedAt: {type: string, format: date-time, nullable: true}
        modifiedAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [new, analyzing, applicable, not_applicable, remediation_planned, remediating, resolved, archived]}
        statusReason: {type: string, nullable: true}
        criteriaRevision: {type: integer}
        criteriaChangedAt: {type: string, format: date-time}
        matchedRevision: {type: integer, nullable: true}
        matchedAt: {type: string, format: date-time, nullable: true}
        matchedIngestionAt: {type: string, format: date-time, nullable: true}
        matchTruncated: {type: boolean}
        editedByUser: {type: boolean}
        unmatchedCriteria: {type: integer, minimum: 0, description: Criteria that could not be matched to a Software Product and therefore were not evaluated.}
        criteriaIncomplete: {type: boolean, description: The feed adapter had to leave affected software out of the criteria (too many products or rules, unusual versions). Analysts must not treat the criteria as complete.}
        criteriaSkipped: {type: integer, minimum: 0, description: How many criteria or rules were left out (see criteriaIncomplete).}
        criteriaChangedUpstream: {type: boolean, description: The feed reported different criteria for this advisory after an analyst decision; the criteria were kept as they are. Cleared by an analyst criteria edit.}
        createdBy: {type: string, nullable: true}
        applicableAt: {type: string, format: date-time, nullable: true}
        resolvedAt: {type: string, format: date-time, nullable: true}
        archivedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SecurityAdvisoryActionResult:
      allOf:
        - {$ref: '#/components/schemas/SecurityAdvisory'}
