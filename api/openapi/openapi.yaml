        - name: platform
          in: query
          schema: {type: string}
        - name: includeDeleted
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: One page of artifacts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagementArtifactList'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /management-artifacts/{id}:
    get:
      operationId: getManagementArtifact
      summary: Get an artifact with assignment history and current observation counts.
      description: "Needs `endpoint.management.view` or `endpoints.manage`. Assignments are all current ones plus at most the 200 most recently closed intervals (older history is not returned). `targetGroupExternalId` is returned only to callers who also hold `organization.directory.view`, otherwise it is null. Observation counts cover active observations of live devices; observations a complete snapshot no longer reported are retired and not counted."
      security:
