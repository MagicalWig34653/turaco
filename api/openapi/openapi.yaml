              schema: {$ref: '#/components/schemas/DeviceManagementList'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '409': {$ref: '#/components/responses/EndpointsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /devices/{id}/management/{artifactId}/path:
    get:
      operationId: getDeviceAssignmentPath
      summary: Explain the assignment path for a Device and artifact.
      description: "Needs endpoint.management.view or endpoints.manage and endpoints.view or endpoints.manage. Expected Applicable is Turaco-derived, not provider state. Group and User names require organization.directory.view."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: artifactId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Management view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentPathView'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '409': {$ref: '#/components/responses/EndpointsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /directory-groups/{id}/management:
    get:
      operationId: getDirectoryGroupManagement
      summary: List management affecting a Directory Group.
      description: "Needs endpoint.management.view or endpoints.manage and organization.directory.view. Expected Applicable is Turaco-derived, not provider state. Names require organization.directory.view. Evaluation is bounded and may be truncated."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
