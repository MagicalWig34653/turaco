        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /devices/{id}/management:
    get:
      operationId: listDeviceManagement
      summary: List assigned, expected and observed artifact states for a Device.
      description: "Needs endpoint.management.view or endpoints.manage and endpoints.view or endpoints.manage. Expected Applicable is Turaco-derived, not provider state. Group and User names require organization.directory.view."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: kind
          in: query
          schema: {type: string, enum: [application, configuration_profile, compliance_policy, endpoint_security_policy, script, remediation]}
        - name: state
          in: query
          schema: {type: string, enum: [applied, pending, failed, conflict, not_applicable, unknown, none]}
        - name: expected
          in: query
          schema: {type: string, enum: [applicable, excluded, not_applicable, unknown]}
        - name: mismatch
          in: query
          schema: {type: string, enum: [assigned_not_observed, expected_not_applied, observed_not_expected]}
      responses:
        '200':
          description: Management view.
          content:
