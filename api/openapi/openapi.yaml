              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/validate:
    post:
      operationId: validateDeployment
      summary: Validate a plan including a bounded evaluation of every ring.
      description: "Needs `deployments.manage` (elevated). Takes no body and changes nothing. Returns blocking issues and warnings plus per-ring target counts (`evaluated: true`). 429 endpoints.evaluation_busy when too many evaluations run. Blocking: version_not_approved, product_not_approved, package_gate_closed (hash mismatch, revoked version, blocked product or publication after revoke), no_rings, target_set_archived, window_required, change_window_invalid, no_window_high_impact, too_many_targets, evaluation_incomplete, approval_required. Warnings: package_not_published, no_targets, high_impact, overlap_check_truncated, overlapping_deployment (another submitted, approved or scheduled plan of the same product, `deploymentId` and the shared Device `count`; at most 10 plans compared)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The validation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentValidation'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '429': {$ref: '#/components/responses/DeploymentsBusy'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/submit:
    post:
      operationId: submitDeployment
      summary: Submit a high-impact draft plan for its plan Approval.
      description: "Needs `deployments.manage` and `deployments.high_impact` (403 endpoints.high_impact_required) and `expectedVersion`; draft only. Only high-impact plans are submitted (409 endpoints.approval_not_required otherwise; they are scheduled directly). The plan must have no blocking issue except approval_required (409 endpoints.deployment_invalid with `issues`). Exactly one approver, a User or a Team (400 otherwise); the approver needs `deployments.approve`, and the owner, creator, editors, submitter and the authors and last editors of the plan's Target Sets are excluded (400 endpoints.no_eligible_approver). 409 endpoints.plan_changed when the plan or a Target Set version changed after validation; 409 endpoints.editors_full; 429 endpoints.evaluation_busy. The Approval (subject `deployment`) is bound to the plan hash `planSha256` over version, intent, supersede and every ring (gates, Change, cap and Target Set version). Moves the plan to `pending_approval`. Audited."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentSubmit'}
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '429': {$ref: '#/components/responses/DeploymentsBusy'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/schedule:
    post:
      operationId: scheduleDeployment
      summary: Schedule a valid plan.
      description: "Needs `deployments.manage` and `expectedVersion`. A plan that is not high impact is scheduled from `draft`. A high-impact plan additionally needs `deployments.high_impact` (403 endpoints.high_impact_required) and must be `approved` (409 endpoints.approval_required); when the plan hash differs from the approved one, or the plan or a Target Set version changed after validation, it is refused with 409 endpoints.plan_changed. 429 endpoints.evaluation_busy. Blocking issues are 409 endpoints.deployment_invalid with `issues`. The structural check and the plan hash are re-run inside the transaction. Emits `DeploymentScheduled`; audited. Nothing is executed in G2."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SoftwareVersionRequest'}
      responses:
        '200':
          description: The plan.
