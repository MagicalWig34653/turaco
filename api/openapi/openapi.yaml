              schema: {$ref: '#/components/schemas/Deployment'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/rings:
    post:
      operationId: addDeploymentRing
      summary: Append a ring to a draft plan.
      description: "Needs `deployments.manage` (elevated) and the plan's `expectedVersion`; draft only (rings of other statuses are frozen by a database trigger). At most 10 rings. The first ring is the pilot: only it may set `noWindowRequired`; every other ring needs `changeId` naming an `approved` or `scheduled` Change whose window has not ended (409 endpoints.change_window_invalid). A ring on an all-Devices Target Set needs `deployments.high_impact` (403 endpoints.high_impact_required); an archived Target Set is 409 endpoints.target_set_archived. A ring on an all-Devices or nested-root-group Target Set needs a Change window even as pilot (409 endpoints.no_window_high_impact). The Change must be readable by the planner. `maxTargets` defaults to and is capped at 5000. Audited."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentRingWrite'}
      responses:
        '201':
          description: The plan and the new ring.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentRingResult'}
        '400': {$ref: '#/components/responses/DeploymentsInvalid'}
        '404': {$ref: '#/components/responses/DeploymentsNotFound'}
        '409': {$ref: '#/components/responses/DeploymentsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /deployments/{id}/rings/reorder:
    post:
      operationId: reorderDeploymentRings
      summary: Reorder the rings of a draft plan.
      description: "Needs `deployments.manage` (elevated) and `expectedVersion`; draft only. `ringIds` must list every ring exactly once in the new order (400 otherwise). A ring with `noWindowRequired` can only stay at position 1 (400). Audited."
