  /devices/{id}/link:
    post:
      operationId: linkDevice
      summary: Link a device to an asset.
      description: "Needs `endpoints.manage` and `assets.view`. `expectedVersion` is required (400 endpoints.invalid_request when missing). The asset must exist and not be disposed, lost or retired; one live device per asset (409 endpoints.conflict). Audited; clears the automatic-link block. `reason` is a code, not free text."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLink'
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '409': {$ref: '#/components/responses/EndpointsConflict'}
        '429':
          description: endpoints.sync_cooldown - the provider was synchronized less than 30 seconds ago.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /devices/{id}/unlink:
    post:
      operationId: unlinkDevice
      summary: Remove the asset link.
      description: "Needs `endpoints.manage`. `expectedVersion` is required (400 endpoints.invalid_request when missing). Audited; blocks automatic re-linking until a manual link."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUnlink'
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '400': {$ref: '#/components/responses/EndpointsInvalid'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '409': {$ref: '#/components/responses/EndpointsConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /endpoint-findings:
