        '400': {$ref: '#/components/responses/InventoryInvalid'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: postGoodsReceipt
      summary: Post a goods receipt.
      description: "Needs `inventory.manage`. Books a delivery against a purchase order in one transaction: the order's received quantities (over-delivery is refused with 409 inventory.over_receipt, an order that is not sent, acknowledged or partially received with 409 inventory.order_not_receivable), the stock of quantity-tracked products at the given storage location (ledger rows) and one asset per delivered unit of serialized products (one serial number per piece). If any part fails nothing is booked. A posted receipt is immutable. Audited (inventory.goods_receipt.posted); emits GoodsReceived, and PurchaseOrderReceived once the order is complete."
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsReceiptCreate'
      responses:
        '201':
          description: The receipt.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoodsReceipt'}
        '400': {$ref: '#/components/responses/InventoryInvalid'}
        '404': {$ref: '#/components/responses/InventoryNotFound'}
        '409': {$ref: '#/components/responses/InventoryConflict'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
