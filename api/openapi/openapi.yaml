      description: "Requires `tasks.view`, `tasks.manage` or `tasks.work`. The caller's unfinished (open, in progress, blocked) tasks assigned to the caller or one of its Teams, in the shared task order."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
