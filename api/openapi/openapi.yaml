  /devices/{id}/management/diff:
    get:
      operationId: diffDeviceManagement
      summary: Compare management state of two Devices.
      description: "Needs management access plus `endpoints.view` or `endpoints.manage`. Assigned, Expected Applicable and Observed stay separate. Unknown expected results remain uncertain. Scans at most 2000 artifacts per page; use nextCursor when truncated."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: otherDeviceId
          in: query
