      type: object
      additionalProperties: false
      required: [id, provider, providerPackageId, versionId, status, installerSha256, hashMismatch, versionRevoked, productBlocked, publishedAfterRevoke, packageAttempt, publishAttempt, publishedAt, managementProvider, managementArtifactExternalId, managementArtifactId, source, observedAt, lastSyncedAt, publishRequestedAt, version]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        providerPackageId: {type: [string, "null"]}
        versionId: {type: string, format: uuid}
        status: {type: string, enum: [requested, building, packaged, published, failed], description: 'requested is Turaco''s request before the provider answered; the others are provider-reported.'}
        installerSha256: {type: [string, "null"], description: Installer hash reported by the provider.}
        hashMismatch: {type: boolean, description: 'An open package_hash_mismatch finding: the provider-reported hash differs from the approved hash. Publishing is refused.'}
        versionRevoked: {type: boolean, description: The version's approval was revoked; publishing is refused.}
        productBlocked: {type: boolean, description: The product is blocked or retired; publishing is refused.}
        publishedAfterRevoke: {type: boolean, description: 'An open package_published_after_revoke finding: the provider reports the package published although Turaco would refuse publishing.'}
        packageAttempt: {type: integer, description: 'Packaging attempt number; a failed package can be packaged again, which increments it.'}
        publishAttempt: {type: integer, description: Publishing attempt number.}
        publishedAt: {type: [string, "null"], format: date-time}
        managementProvider: {type: [string, "null"]}
        managementArtifactExternalId: {type: [string, "null"]}
        managementArtifactId: {type: [string, "null"], format: uuid}
        source: {type: string, description: 'Where the status came from (operation or sync).'}
        observedAt: {type: [string, "null"], format: date-time}
        lastSyncedAt: {type: [string, "null"], format: date-time}
        publishRequestedAt: {type: [string, "null"], format: date-time}
        version: {type: integer}
    SoftwarePackageFindingKind:
      type: string
      description: "Endpoint Finding kinds with a Software Package subject. They are shown with the package (`hashMismatch`, `publishedAfterRevoke`), never in the device findings list. package_hash_mismatch detail carries `reason` (hash_differs, binding_differs) and `differingFields`; package_published_after_revoke detail carries `reason` (version_not_approved, product_not_approved, published_without_request, artifact_already_linked, publish_in_flight)."
      enum: [package_hash_mismatch, package_published_after_revoke]
    SoftwarePackageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SoftwarePackage'}}
        nextCursor: {type: string, description: 'Empty when there is no further page.'}
    SoftwarePackageSyncResult:
      type: object
      additionalProperties: false
      required: [checked, changed, linked, findingsRaised, findingsResolved, stale, errors]
      properties:
        checked: {type: integer}
        stale: {type: integer, description: Packages whose provider report was older than the stored one and was ignored.}
        errors: {type: integer, description: Packages the provider could not report on.}
        changed: {type: integer}
        linked: {type: integer}
        findingsRaised: {type: integer}
        findingsResolved: {type: integer}
    SoftwareCatalogEntry:
      type: object
      additionalProperties: false
      required: [providerId, name, publisher, latestVersion, sourceUrl]
      properties:
        providerId: {type: string}
        name: {type: string}
        publisher: {type: [string, "null"]}
        latestVersion: {type: [string, "null"]}
        sourceUrl: {type: [string, "null"], description: https only.}
    SoftwareCatalogList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SoftwareCatalogEntry'}}
    SoftwareVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer}
    TargetGroup:
      type: object
      additionalProperties: false
      required: [externalId]
      properties:
        externalId: {type: string, minLength: 1, maxLength: 200, description: 'External id of the provider Device Group (no spaces or control characters). Matches current provider memberships.'}
        includeNested: {type: boolean, description: 'Also match Devices in Directory Groups nested below it (expanded through the Organization directory graph; `incomplete` when a lookup was cut).'}
    TargetFilters:
      type: object
      additionalProperties: false
      description: "Every set clause must match (AND). A list clause matches any of its values; manufacturer and model compare case-insensitively. Empty clauses are left out of the stored definition."
      properties:
        platform: {type: array, maxItems: 20, items: {type: string, enum: [windows, macos, ios, android, linux, other]}}
        osVersionPrefix: {type: string, maxLength: 50, description: Case-insensitive prefix of the OS version.}
        ownership: {type: array, maxItems: 20, items: {type: string, enum: [corporate, personal, unknown]}}
        compliance: {type: array, maxItems: 20, items: {type: string, enum: [compliant, noncompliant, in_grace_period, unknown]}}
        manufacturer: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 100}}
        model: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 100}}
        groups: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/TargetGroup'}}
        assetLocationIds: {type: array, maxItems: 20, items: {type: string, format: uuid}, description: Location of the Device's linked Asset (read through assets/public).}
    TargetDefinition:
      type: object
      additionalProperties: false
      description: "Closed structure, decoded strictly: unknown fields at any depth are refused (400). Normalized (sorted, de-duplicated, lower-case ids) and stored canonically, at most 64 KiB. An explicit include matches regardless of filters; an exclude always wins; a Device cannot be in both lists. Without filters and includes the definition selects every Device (`allDevices`, high impact)."
      properties:
        filters: {$ref: '#/components/schemas/TargetFilters'}
        includeDeviceIds: {type: array, maxItems: 500, items: {type: string, format: uuid}}
        excludeDeviceIds: {type: array, maxItems: 500, items: {type: string, format: uuid}}
    TargetSet:
      type: object
      additionalProperties: false
      required: [id, reference, name, description, ownerUserId, definition, allDevices, highImpactReason, includeDeviceCount, excludeDeviceCount, deviceListsRedacted, updatedBy, archivedAt, createdBy, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, description: 'TS-xxxxxx'}
        name: {type: string}
        description: {type: [string, "null"]}
        ownerUserId: {type: string, format: uuid}
        definition: {$ref: '#/components/schemas/TargetDefinition'}
        allDevices: {type: boolean, description: The definition selects every Device; plans using it are high impact.}
        highImpactReason: {type: [string, "null"], enum: [all_devices, nested_root_group, null], description: Why plans using the set are high impact.}
        includeDeviceCount: {type: integer}
        excludeDeviceCount: {type: integer}
        deviceListsRedacted: {type: boolean, description: 'True without endpoints.view: the explicit lists are returned empty; the counts remain.'}
        updatedBy: {type: [string, "null"], format: uuid}
        archivedAt: {type: [string, "null"], format: date-time}
        createdBy: {type: string, format: uuid}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TargetSetList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TargetSet'}}
        nextCursor: {type: [string, "null"], description: 'Empty or absent when there is no further page.'}
    TargetSetWrite:
      type: object
      additionalProperties: false
      required: [name, definition]
      properties:
        name: {type: string, minLength: 1, maxLength: 150}
        description: {type: string, maxLength: 1000}
        ownerUserId: {type: string, format: uuid, description: Defaults to the caller.}
        definition: {$ref: '#/components/schemas/TargetDefinition'}
        expectedVersion: {type: integer, description: Required on PATCH; refused on create.}
    TargetExample:
      type: object
      additionalProperties: false
      required: [deviceId, name, redacted, osPlatform, complianceState]
      properties:
        deviceId: {type: string, format: uuid}
        name: {type: string}
        redacted: {type: boolean, description: Always false; kept for compatibility.}
        osPlatform: {type: string}
        complianceState: {type: string}
    TargetSetEvaluation:
      type: object
      additionalProperties: false
      required: [matched, scanned, truncated, incomplete, cap, byPlatform, byCompliance, evaluatedAt, examples, examplesRedacted]
      properties:
        matched: {type: integer, description: Matched Devices (at most `cap`; a lower bound when `truncated`).}
        scanned: {type: integer, description: Live Devices looked at (at most 50 000).}
        truncated: {type: boolean, description: More than `cap` Devices matched or more than 50 000 Devices exist.}
        incomplete: {type: boolean, description: A nested group or Asset location lookup was cut; Devices may be missing.}
        cap: {type: integer, description: Maximum kept matches and ring targets (5000).}
        byPlatform: {type: object, additionalProperties: {type: integer}}
        byCompliance: {type: object, additionalProperties: {type: integer}}
        evaluatedAt: {type: string, format: date-time}
        examples: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/TargetExample'}}
        examplesRedacted: {type: boolean, description: 'Examples are withheld (no endpoints.view, or an approver-only read).'}
    TargetClauseResult:
      type: object
      additionalProperties: false
      required: [clause, result, reason]
      properties:
        clause: {type: string, enum: [platform, os_version_prefix, ownership, compliance, manufacturer, model, group, asset_location_id, include, exclude, all_devices]}
        result: {type: string, enum: [matched, failed]}
        reason: {type: [string, "null"], description: 'Why a clause failed: value_differs, value_missing, not_listed, not_member, no_asset_link, no_location.'}
    TargetSetExplanation:
      type: object
      additionalProperties: false
      required: [targetSetId, deviceId, deviceName, redacted, matched, incomplete, evaluatedAt, clauses]
      properties:
        targetSetId: {type: string, format: uuid}
        deviceId: {type: string, format: uuid}
        deviceName: {type: string}
        redacted: {type: boolean, description: Always false; kept for compatibility.}
        matched: {type: boolean}
        incomplete: {type: boolean}
        evaluatedAt: {type: string, format: date-time}
        clauses: {type: array, items: {$ref: '#/components/schemas/TargetClauseResult'}}
    DeploymentStatus:
      type: string
      enum: [draft, pending_approval, approved, scheduled, cancelled, resolving_targets, ready, running, paused, completed, completed_with_errors, failed]
      description: "Execution (F9 G3) continues after scheduled: resolving_targets, ready, running, paused (statusReason says why: manual_pause, failure_threshold, version_revoked, product_blocked, window_closed, artifact_changed, ...), completed, completed_with_errors, failed (became_high_impact, targets_grew, ...). Ring halted reasons include assignment_failed, no_evidence and not_applicable_ratio; target reasons include read_back_missing (expired) and provider_mismatch (not_applicable). Planning lifecycle: draft → pending_approval → approved → scheduled (high impact), draft → scheduled (otherwise), any planning status → cancelled. A rejected plan Approval returns the plan to draft with statusReason approval_rejected; an approver who lost deployments.approve returns it with approver_not_authorized. Both clear approvalId, planSha256, submittedBy and submittedAt."
    Deployment:
      type: object
      additionalProperties: false
      required: [id, reference, name, softwareVersionId, productId, productName, productVersion, intent, supersede, status, statusReason, ownerUserId, createdBy, editors, highImpact, createTasks, approvalId, submittedBy, submittedAt, planSha256, approvedAt, scheduledBy, scheduledAt, cancelledBy, cancelledAt, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, description: 'DEP-xxxxxx'}
        name: {type: string}
        softwareVersionId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        productName: {type: string}
        productVersion: {type: string}
        intent: {type: string, enum: [install, update, uninstall]}
        supersede: {type: boolean}
        createTasks: {type: boolean, description: 'Follow-up Tasks (context type deployment) are created for failure clusters and halts while the Deployment runs.'}
        status: {$ref: '#/components/schemas/DeploymentStatus'}
        statusReason: {type: [string, "null"], description: 'approval_rejected, approver_not_authorized or a cancel reason code.'}
        ownerUserId: {type: string, format: uuid}
        createdBy: {type: string, format: uuid}
        editors: {type: array, items: {type: string, format: uuid}, description: Users who changed the plan; excluded as approvers.}
        highImpact: {type: boolean, description: 'A ring on an all-Devices or nested-root-group Target Set, intent uninstall or supersede, or a large target count. Needs deployments.high_impact and an approved plan Approval. Stored on drafts as a snapshot; validate, submit and schedule recompute it.'}
        approvalId: {type: [string, "null"], format: uuid}
        submittedBy: {type: [string, "null"], format: uuid}
        submittedAt: {type: [string, "null"], format: date-time}
        planSha256: {type: [string, "null"], description: 'Hash of the submitted (and later scheduled) plan; scheduling an approved plan with a different hash is refused (plan_changed).'}
        approvedAt: {type: [string, "null"], format: date-time}
        scheduledBy: {type: [string, "null"], format: uuid}
        scheduledAt: {type: [string, "null"], format: date-time}
        cancelledBy: {type: [string, "null"], format: uuid}
        cancelledAt: {type: [string, "null"], format: date-time}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DeploymentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Deployment'}}
        nextCursor: {type: [string, "null"], description: 'Empty or absent when there is no further page.'}
    DeploymentRing:
      type: object
      additionalProperties: false
      required: [id, position, name, targetSetId, targetSetReference, targetSetName, approvalRequired, successThresholdPercent, minFreshEvidencePercent, soakMinutes, changeId, noWindowRequired, maxTargets]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, minimum: 1, maximum: 10, description: 1 is the pilot ring.}
        name: {type: string}
        targetSetId: {type: string, format: uuid}
        targetSetReference: {type: string}
        targetSetName: {type: string}
        approvalRequired: {type: boolean, description: Promotion into this ring needs an Approval (G3).}
        successThresholdPercent: {type: integer, minimum: 1, maximum: 100}
        minFreshEvidencePercent: {type: [integer, "null"], minimum: 1, maximum: 100}
        soakMinutes: {type: integer, minimum: 0, maximum: 43200}
        changeId: {type: [string, "null"], format: uuid, description: The Change whose maintenance window gates the ring.}
        noWindowRequired: {type: boolean, description: Pilot ring only.}
        maxTargets: {type: integer, minimum: 1, maximum: 5000}
    DeploymentRingWrite:
      type: object
      additionalProperties: false
      required: [name, targetSetId, successThresholdPercent, expectedVersion]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        targetSetId: {type: string, format: uuid}
        approvalRequired: {type: boolean}
        successThresholdPercent: {type: integer, minimum: 1, maximum: 100}
        minFreshEvidencePercent: {type: [integer, "null"], minimum: 1, maximum: 100}
        soakMinutes: {type: integer, minimum: 0, maximum: 43200}
        changeId: {type: [string, "null"], format: uuid, description: 'An approved or scheduled Change whose window has not ended. Required unless noWindowRequired.'}
        noWindowRequired: {type: boolean, description: 'Pilot ring (position 1) only; exclusive with changeId.'}
        maxTargets: {type: [integer, "null"], minimum: 1, maximum: 5000, description: Defaults to 5000.}
        expectedVersion: {type: integer, description: The plan's version.}
    DeploymentRingResult:
      type: object
      additionalProperties: false
      required: [deployment, ring]
      properties:
        deployment: {$ref: '#/components/schemas/Deployment'}
        ring: {$ref: '#/components/schemas/DeploymentRing'}
    DeploymentRingReorder:
      type: object
      additionalProperties: false
      required: [ringIds, expectedVersion]
      properties:
        ringIds: {type: array, maxItems: 10, items: {type: string, format: uuid}}
        expectedVersion: {type: integer}
    DeploymentIssue:
      type: object
      additionalProperties: false
      required: [code, blocking, ringId, count, deploymentId]
      properties:
        code: {type: string, enum: [version_not_approved, product_not_approved, package_gate_closed, package_not_published, no_rings, target_set_archived, window_required, change_window_invalid, no_window_high_impact, approval_required, too_many_targets, no_targets, evaluation_incomplete, overlapping_deployment, overlap_check_truncated, high_impact]}
        blocking: {type: boolean, description: Blocking issues prevent submission and scheduling; warnings never block.}
        ringId: {type: [string, "null"], format: uuid}
        count: {type: [integer, "null"], description: 'Matched Devices (too_many_targets) or shared Devices (overlapping_deployment).'}
        deploymentId: {type: [string, "null"], format: uuid, description: The overlapping plan.}
    DeploymentRingTargets:
      type: object
      additionalProperties: false
      required: [ringId, matched, truncated, incomplete]
      properties:
        ringId: {type: string, format: uuid}
        matched: {type: integer}
        truncated: {type: boolean}
        incomplete: {type: boolean}
    DeploymentValidation:
      type: object
      additionalProperties: false
      required: [valid, highImpact, highImpactReason, incomplete, totalTargets, evaluated, validatedAt, issues, rings]
      properties:
        valid: {type: boolean, description: No blocking issue.}
        highImpact: {type: boolean}
        highImpactReason: {type: [string, "null"], enum: [uninstall, supersede, all_devices, nested_root_group, target_count, null]}
        incomplete: {type: boolean, description: A ring evaluation was incomplete.}
        totalTargets: {type: [integer, "null"], description: Matched Devices over all rings (evaluated validations).}
        evaluated: {type: boolean, description: 'True when the rings were evaluated (POST validate); the detail read runs only the structural checks.'}
        validatedAt: {type: string, format: date-time}
        issues: {type: array, items: {$ref: '#/components/schemas/DeploymentIssue'}}
        rings: {type: array, items: {$ref: '#/components/schemas/DeploymentRingTargets'}}
    DeploymentTransition:
      type: object
      additionalProperties: false
      required: [fromStatus, toStatus, operation, reason, planSha256, actorUserId, actorSystem, createdAt]
      properties:
        fromStatus: {oneOf: [{$ref: '#/components/schemas/DeploymentStatus'}, {type: "null"}]}
        toStatus: {$ref: '#/components/schemas/DeploymentStatus'}
        operation: {type: string, description: 'created, updated, ring_added, ring_updated, ring_removed, rings_reordered, submitted, approved, approval_rejected, approver_not_authorized, scheduled, cancelled.'}
        reason: {type: [string, "null"]}
        planSha256: {type: [string, "null"]}
        actorUserId: {type: [string, "null"], format: uuid}
        actorSystem: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
    DeploymentApprovalState:
      type: object
      additionalProperties: false
      required: [id, status, approverUserId, approverTeamId, decidedByUserId, decidedAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, rejected, cancelled]}
        approverUserId: {type: [string, "null"], format: uuid}
        approverTeamId: {type: [string, "null"], format: uuid}
        decidedByUserId: {type: [string, "null"], format: uuid}
        decidedAt: {type: [string, "null"], format: date-time}
    DeploymentChangeWindow:
      type: object
      additionalProperties: false
      required: [id, hidden, reference, status, windowStart, windowEnd]
      properties:
        id: {type: string, format: uuid}
        hidden: {type: boolean, description: The caller may not read the Change; reference, status and window are null.}
        reference: {type: [string, "null"]}
        status: {type: [string, "null"]}
        windowStart: {type: [string, "null"], format: date-time}
        windowEnd: {type: [string, "null"], format: date-time}
    DeploymentDetail:
      allOf:
        - {$ref: '#/components/schemas/Deployment'}
        - type: object
          required: [rings, transitions, approvals, changes, validation]
          properties:
            rings: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/DeploymentRing'}}
            transitions: {type: array, items: {$ref: '#/components/schemas/DeploymentTransition'}}
            approvals: {type: array, items: {$ref: '#/components/schemas/DeploymentApprovalState'}}
            changes: {type: object, additionalProperties: {$ref: '#/components/schemas/DeploymentChangeWindow'}, description: Keyed by Change id.}
            validation: {$ref: '#/components/schemas/DeploymentValidation'}
    DeploymentWrite:
      type: object
      additionalProperties: false
      required: [name, softwareVersionId, intent]
      properties:
        name: {type: string, minLength: 1, maxLength: 150}
        softwareVersionId: {type: string, format: uuid}
        intent: {type: string, enum: [install, update, uninstall]}
        supersede: {type: boolean, description: High impact.}
        createTasks: {type: boolean, description: 'Create follow-up Tasks for failures and halts (draft only). Omitted on PATCH keeps the stored value.'}
        ownerUserId: {type: string, format: uuid, description: 'Defaults to the caller on create; empty keeps the owner on PATCH.'}
        expectedVersion: {type: integer, description: Required on PATCH; refused on create.}
    DeploymentSubmit:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      description: Exactly one of approverUserId and approverTeamId.
      properties:
        approverUserId: {type: [string, "null"], format: uuid}
        approverTeamId: {type: [string, "null"], format: uuid}
        expectedVersion: {type: integer}
    DeploymentCancel:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: {type: string, enum: [superseded, no_longer_needed, plan_error, security_risk, other]}
        expectedVersion: {type: integer}
    DeploymentHalt:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: {type: string, enum: [manual_halt, quality_issue, security_risk, other]}
        expectedVersion: {type: integer}
    DeploymentRingResume:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        reason: {type: string, enum: ["", retry], description: "Other values are 400 endpoints.invalid_request."}
        expectedVersion: {type: integer}
    DeploymentRingApprovalRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        approverUserId: {type: string, format: uuid}
        approverTeamId: {type: string, format: uuid}
        expectedVersion: {type: integer}
    DeploymentRingStatus:
      type: string
      enum: [pending, active, awaiting_promotion, promoted, halted]
    DeploymentTargetState:
      type: string
      enum: [pending, assignment_requested, awaiting_observation, successful, failed, expired, already_satisfied, not_applicable, cancelled]
      description: "Observation-derived outcome per target. A provider observation that contradicts a decided state raises the Endpoint Finding deployment_evidence_conflict; the decided state is not changed."
    DeploymentRingProgress:
      type: object
      required: [ringId, ringRunId, position, name, status, counts, nextGate]
      properties:
        ringId: {type: string, format: uuid}
        ringRunId: {type: string, format: uuid}
        position: {type: integer}
        name: {type: string}
        status: {$ref: '#/components/schemas/DeploymentRingStatus'}
        statusReason: {type: string, nullable: true}
        activatedAt: {type: string, format: date-time, nullable: true}
        settledAt: {type: string, format: date-time, nullable: true}
        awaitingSince: {type: string, format: date-time, nullable: true}
        promotedAt: {type: string, format: date-time, nullable: true}
        haltedAt: {type: string, format: date-time, nullable: true}
        assignmentRequestedAt: {type: string, format: date-time, nullable: true}
        assignmentClearedAt: {type: string, format: date-time, nullable: true}
        promotionApprovalStatus: {type: string, nullable: true}
        approvalRequired: {type: boolean}
        successThresholdPercent: {type: integer}
        soakMinutes: {type: integer}
        counts: {type: object, additionalProperties: {type: integer}, description: Targets per DeploymentTargetState.}
        freshSuccessful: {type: integer}
        freshObserved: {type: integer}
        successRatePercent: {type: number, nullable: true}
        soakRemainingSeconds: {type: integer}
        nextGate: {type: string, description: "previous_ring, resume, none, observations, evidence, soak, threshold, fresh_evidence, completion, approval, promotion"}
        clearPending: {type: boolean}
        clearFailed: {type: boolean, description: "Withdrawing an assignment failed; see the deployment_clear_failed Finding."}
        retryCount: {type: integer, description: "Explicit retries used after assignment_failed (at most 3)."}
    DeploymentProgress:
      type: object
      required: [deployment, rings]
      properties:
        deployment: {$ref: '#/components/schemas/Deployment'}
        clearPending: {type: boolean, description: Assignments are being withdrawn and need deploy write enabled.}
        resolvingStuck: {type: boolean, description: resolving_targets for more than 15 minutes.}
        rings: {type: array, items: {$ref: '#/components/schemas/DeploymentRingProgress'}}
    DeploymentReport:
      type: object
      required: [deployment, generatedAt, totals, rings, topFailureReasons, clusters, people, transitions, followUps]
      properties:
        deployment: {$ref: '#/components/schemas/Deployment'}
        generatedAt: {type: string, format: date-time}
        totals: {type: object, additionalProperties: {type: integer}, description: Target counts by state across all rings.}
        successRatePercent: {type: number, nullable: true, description: 'successful / (successful + failed + expired); null while nothing was decided.'}
        medianSecondsToSuccess: {type: integer, nullable: true}
        rings:
          type: array
          items:
            type: object
            required: [ringId, ringRunId, position, name, status, successThresholdPercent, counts, gates]
            properties:
              ringId: {type: string, format: uuid}
              ringRunId: {type: string, format: uuid}
              position: {type: integer}
              name: {type: string}
              status: {type: string}
              statusReason: {type: string, nullable: true}
              startedAt: {type: string, format: date-time, nullable: true}
              endedAt: {type: string, format: date-time, nullable: true}
              successThresholdPercent: {type: integer}
              counts: {type: object, additionalProperties: {type: integer}}
              successRatePercent: {type: number, nullable: true}
              medianSecondsToSuccess: {type: integer, nullable: true}
              gates:
                type: array
                items:
                  type: object
                  required: [gate, passed, at]
                  properties:
                    gate: {type: string, description: 'success_threshold, soak or promotion when passed; the halt reason code when failed.'}
                    passed: {type: boolean}
                    at: {type: string, format: date-time}
                    reason: {type: string, nullable: true}
        topFailureReasons:
          type: array
          items:
            type: object
            required: [code, count]
            properties:
              code: {type: string, description: "The provider's raw status or Turaco's reason code."}
              count: {type: integer}
        clusters:
          type: array
          description: 'Open failure clusters derived by Turaco (finding kind deployment_failure_cluster).'
          items:
            type: object
            required: [findingId, dimension, value, failed, total, raisedAt]
            properties:
              findingId: {type: string, format: uuid}
              dimension: {type: string, enum: [error_code, model, manufacturer, os_version, ring]}
              value: {type: string}
              failed: {type: integer}
              total: {type: integer}
              raisedAt: {type: string, format: date-time}
        people:
          type: object
          properties:
            ownerUserId: {type: string, format: uuid}
            createdBy: {type: string, format: uuid}
            submittedBy: {type: string, format: uuid, nullable: true}
            scheduledBy: {type: string, format: uuid, nullable: true}
            startedBy: {type: string, format: uuid, nullable: true}
            cancelledBy: {type: string, format: uuid, nullable: true}
            approvedAt: {type: string, format: date-time, nullable: true}
            promotions:
              type: array
              items:
                type: object
                properties:
                  ringId: {type: string, format: uuid}
                  by: {type: string, format: uuid, nullable: true}
                  at: {type: string, format: date-time}
        transitions:
          type: array
          items:
            type: object
            properties:
              from: {type: string, nullable: true}
              to: {type: string}
              operation: {type: string}
              reason: {type: string, nullable: true}
              actorUserId: {type: string, format: uuid, nullable: true}
              actorSystem: {type: string, nullable: true}
              at: {type: string, format: date-time}
        followUps:
          type: array
          description: 'Follow-up Tasks created when `createTasks` is set (Task context type `deployment`, context id = the Deployment).'
          items:
            type: object
            required: [reason, taskId, createdAt]
            properties:
              reason: {type: string, description: 'failure_cluster or another reason code.'}
              ringId: {type: string, format: uuid, nullable: true}
              taskId: {type: string, format: uuid}
              createdAt: {type: string, format: date-time}
