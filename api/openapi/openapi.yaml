        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /devices/{id}/management-observations:
    get:
      operationId: listDeviceManagementObservations
      summary: List a device's current provider management observations.
      description: "Needs (`endpoint.management.view` or `endpoints.manage`) and (`endpoints.view` or `endpoints.manage`)."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
