        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/EndpointsNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /devices/{id}/management-history:
    get:
      operationId: getDeviceManagementHistory
      summary: List meaningful device management changes, newest first.
      description: "Needs management access plus `endpoints.view` or `endpoints.manage`. Includes observation state changes, group joins/leaves and assignments addressing the Device; group data is redacted without `organization.directory.view`."
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One history page.
