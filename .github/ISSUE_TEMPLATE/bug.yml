name: Bug
about: Report a reproducible defect
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal deterministic reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
