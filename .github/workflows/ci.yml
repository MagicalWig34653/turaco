name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: turaco
          POSTGRES_PASSWORD: turaco-ci
          POSTGRES_DB: turaco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turaco -d turaco"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://turaco:turaco-ci@localhost:5432/turaco?sslmode=disable
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: ./scripts/ci-install.sh

      - name: Apply migrations
        run: go run ./backend/cmd/turaco-migrate

      - name: Quality gate
        run: make check

      - name: Build
        run: make build
